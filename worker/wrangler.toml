name = "autamedica-signaling-server"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[observability]
enabled = true

[dev]
port = 8787

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

[[durable_objects.bindings]]
name = "GEMINI_LIVE_ROOM"
class_name = "GeminiLiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GeminiLiveRoom"]
