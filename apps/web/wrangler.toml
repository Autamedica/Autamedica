name = "autamedica-web"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat_v2", "global_fetch_strictly_public"]

# Astro build output
pages_build_output_dir = "dist"

# MEMED_MOBILE_ENABLED and MEMED_MOBILE_PILOT_DOCTOR_ID are intentionally
# managed as Cloudflare Pages secrets by deploy-production.yml. Do not declare
# them in Wrangler vars: both sources share the same runtime binding namespace.

[vars]
NODE_ENV = "production"
MEMED_RX_ENABLED = "false"
MEMED_API_URL = "https://api.memed.com.br/v1"
MEMED_SCRIPT_URL = "https://partners.memed.com.br/integration.js"

[env.production.vars]
NODE_ENV = "production"
# Memed production is enabled for active, CFM-verified Brazilian CRM doctors.
# Set MEMED_PILOT_DOCTOR_ID optionally in Cloudflare env if an explicit allowlist is needed.
MEMED_RX_ENABLED = "true"
MEMED_API_URL = "https://api.memed.com.br/v1"
MEMED_SCRIPT_URL = "https://partners.memed.com.br/integration.js"

# Dominios personalizados (configurar en el dashboard de Cloudflare Pages)
# custom_domains = ["www.autamedica.com", "autamedica.com"]


