# ============================================================================
# AutaMedica Captive Portal — dnsmasq Configuration
# ============================================================================
# This config makes dnsmasq intercept captive portal detection domains
# and resolve them to this machine (192.168.0.2), triggering the
# "Sign in to network" popup on mobile devices.
#
# Usage:
#   sudo dnsmasq -C /home/edu/Autamedica/apps/captive-portal/dnsmasq-portal.conf --no-daemon
#
# ============================================================================

# Don't read /etc/resolv.conf (we define our own upstream)
no-resolv

# Listen only on the WiFi interface, port 53
interface=wlp1s0
listen-address=192.168.0.2
bind-interfaces
port=53

# Upstream DNS (forward everything else to Cloudflare + Google)
server=1.1.1.1
server=8.8.8.8

# ============================================================================
# CAPTIVE PORTAL DETECTION DOMAINS → Redirect to this PC (192.168.0.2)
# ============================================================================

# Apple iOS / macOS
address=/captive.apple.com/192.168.0.2
address=/www.apple.com/192.168.0.2

# Android / Chrome OS
address=/connectivitycheck.gstatic.com/192.168.0.2
address=/clients3.google.com/192.168.0.2
address=/play.googleapis.com/192.168.0.2

# Windows 10/11
address=/www.msftconnecttest.com/192.168.0.2
address=/www.msftncsi.com/192.168.0.2

# Firefox
address=/detectportal.firefox.com/192.168.0.2

# Samsung
address=/connectivitycheck.samsung.com/192.168.0.2

# Ubuntu / Linux
address=/connectivity-check.ubuntu.com/192.168.0.2

# ============================================================================
# CACHE & PERFORMANCE
# ============================================================================
cache-size=256

# Log queries for debugging (comment out in production)
# log-queries
# log-facility=/var/log/dnsmasq-portal.log
