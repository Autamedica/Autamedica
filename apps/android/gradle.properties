# 1. CPU & Worker Limiting (Crucial para máquina de 4 cores - evita congelamiento)
org.gradle.workers.max=1
org.gradle.priority=low
org.gradle.parallel=false
org.gradle.vfs.watch=false

# 2. JVM Memory & Low-Latency GC (G1GC evita thrashing de CPU en memoria ajustada)
org.gradle.jvmargs=-Xmx1536m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
# Compila Kotlin dentro del daemon de Gradle (un solo heap) para no levantar un segundo proceso JVM
kotlin.compiler.execution.strategy=in-process

# 3. Caching (Omite tareas sin cambios y acelera inicio)
org.gradle.caching=true
org.gradle.configuration-cache=false

# 4. Kotlin & KSP Incremental Compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=false

# 5. Android Build Flags
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=false

