# 1. Worker tuning (4 cores / 14GB RAM, ~5GB libres)
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.vfs.watch=true

# 2. JVM Memory: Gradle daemon ligero + Kotlin daemon con heap propio (desechable, JIT warm entre builds)
org.gradle.jvmargs=-Xmx2304m -Xms1024m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=daemon

# 3. Caching (Omite tareas sin cambios y acelera inicio)
org.gradle.caching=true
org.gradle.configuration-cache=true

# 4. Kotlin & KSP Incremental Compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true

# 5. Android Build Flags
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
# Kotlin 2.4.21 is managed by the explicit Kotlin Gradle plugins below.
android.builtInKotlin=false
android.newDsl=false
