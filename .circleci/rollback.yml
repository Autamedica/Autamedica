version: 2.1

jobs:
  production_pages_deploy-rollback:
    docker:
      - image: cimg/node:22.15.0
    resource_class: medium
    environment:
      CI: "true"
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COMPONENT_NAME: "<< pipeline.deploy.component_name >>"
      ENVIRONMENT_NAME: "<< pipeline.deploy.environment_name >>"
      NAMESPACE: "<< pipeline.deploy.namespace >>"
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
    steps:
      - checkout
      - run:
          name: Plan rollback
          command: |
            circleci run release plan production_pages_deploy-rollback \
              --environment-name=${ENVIRONMENT_NAME} \
              --namespace=${NAMESPACE} \
              --component-name=${COMPONENT_NAME} \
              --target-version=${TARGET_VERSION} \
              --rollback
      - run:
          name: Install locked workspace dependencies
          command: |
            corepack enable
            corepack prepare pnpm@9.15.2 --activate
            pnpm install --frozen-lockfile
          no_output_timeout: 15m
      - run:
          name: Perform rollback to target version
          command: |
            set -euo pipefail
            export PUBLIC_GA4_MEASUREMENT_ID="G-YRN6QY3BTY"
            export PUBLIC_SUPABASE_URL="${PUBLIC_SUPABASE_URL:-${AUTAMEDICA_SUPABASE_URL:-https://qxjjrpksmwwrmubhvjew.supabase.co}}"
            export PUBLIC_SUPABASE_ANON_KEY="${PUBLIC_SUPABASE_ANON_KEY:-${AUTAMEDICA_SUPABASE_ANON_KEY:-}}"
            export PUBLIC_SIGNALING_URL="${PUBLIC_SIGNALING_URL:-wss://autamedica-http-signaling-server.marques-eduardo95466020.workers.dev/signaling}"
            export PUBLIC_APP_URL="${PUBLIC_APP_URL:-https://www.autamedica.com}"
            export PUBLIC_PATIENTS_URL="https://paciente.autamedica.com"
            export PUBLIC_DOCTORS_URL="https://doctor.autamedica.com"
            export PUBLIC_COMPANIES_URL="https://empresa.autamedica.com"
            export PUBLIC_ADMIN_URL="https://autamedica-admin.pages.dev"
            export RENAPDIS_RL_NUMBER="${RENAPDIS_RL_NUMBER:-RL-2026-47574120-APN-SSVEIYES#MS}"

            projects=(autamedica-web autamedica-doctors autamedica-patients autamedica-companies autamedica-admin)
            for project in "${projects[@]}"; do
              echo "Rolling back ${project} to commit ${TARGET_VERSION}..."
              response=$(curl --fail --silent --show-error --max-time 30 \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/deployments" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
              target_deployment=$(printf '%s' "${response}" | jq -er "select(.success == true) | .result[] | select(.commit_hash == \"${TARGET_VERSION}\") | .id | select(type == \"string\" and length > 0)" | head -1)
              if [[ -n "${target_deployment}" ]]; then
                curl --fail --silent --show-error --max-time 30 \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/deployments/${target_deployment}/rollback" \
                  -X POST \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
                echo "ROLLED_BACK_PROJECT=${project} DEPLOYMENT_ID=${target_deployment} TARGET_COMMIT=${TARGET_VERSION}"
              else
                echo "WARNING: Could not find deployment for ${project} with commit ${TARGET_VERSION}"
              fi
            done
      - run:
          name: Update deployment status to failed
          command: circleci run release update production_pages_deploy-rollback --status=FAILED
          when: on_fail
  cancel-production_pages_deploy-rollback:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update production_pages_deploy-rollback \
              --status=CANCELED
  production_pages_deploy-rollback-release:
    type: release
    plan_name: production_pages_deploy-rollback
    validation:
      enabled: true

workflows:
  rollback:
    jobs:
      - production_pages_deploy-rollback
      - production_pages_deploy-rollback-release:
          requires:
            - production_pages_deploy-rollback
      - cancel-production_pages_deploy-rollback:
          requires:
            - production_pages_deploy-rollback:
                - canceled