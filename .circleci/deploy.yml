version: 2.1

jobs:
  android_release_bundle:
    docker:
      - image: cimg/android:2026.10
    resource_class: medium
    working_directory: ~/project
    environment:
      CI: "true"
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8"
      COMPONENT_NAME: "<< pipeline.deploy.component_name >>"
      ENVIRONMENT_NAME: "<< pipeline.deploy.environment_name >>"
      NAMESPACE: "<< pipeline.deploy.namespace >>"
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
    steps:
      - checkout
      - run:
          name: Validate release tag, version and mainline ancestry
          command: |
            set -euo pipefail
            tag="${CIRCLE_RELEASE_TAG:-}"
            test "${CIRCLE_RELEASE_TRIGGER:-}" = "github_app"
            test "${CIRCLE_RELEASE_EVENT:-}" = "push"
            test "${CIRCLE_RELEASE_OWNER:-}" = "ecucondorSA"
            test "${CIRCLE_RELEASE_REPO:-}" = "Autamedica"
            test "${CIRCLE_RELEASE_CONFIG_REF:-}" = "refs/tags/$tag"
            test "${CIRCLE_RELEASE_CONFIG_REPO:-}" = "ecucondorSA/Autamedica"
            test -n "${CIRCLE_RELEASE_SHA:-}"
            test "${CIRCLE_RELEASE_CONFIG_SHA:-}" = "$CIRCLE_RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$CIRCLE_RELEASE_SHA"
            echo "$tag" | grep -Eq '^android-v[0-9]+\.[0-9]+\.[0-9]+(-rc[1-9][0-9]*)?$'
            version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' apps/android/app/build.gradle.kts | sed -n '1p')"
            test -n "$version"
            tag_version="${tag#android-v}"
            tag_version="${tag_version%%-rc*}"
            test "$tag_version" = "$version"
            git fetch origin main
            git merge-base --is-ancestor "$CIRCLE_RELEASE_SHA" FETCH_HEAD || {
              echo 'Release tag must reference a commit already on main'; exit 1;
            }
            echo "Validated release tag: $tag"
      - run:
          name: Prepare real signing and Firebase inputs (restricted context)
          command: |
            set -euo pipefail
            python3 .circleci/scripts/prepare_android_release.py
      - run:
          name: Plan release
          command: |
            circleci run release plan \
              --environment-name=${ENVIRONMENT_NAME} \
              --namespace=${NAMESPACE} \
              --component-name=${COMPONENT_NAME} \
              --target-version=${TARGET_VERSION}
      - run:
          name: Compile Android Kotlin for signed release
          command: |
            set -euo pipefail
            cd apps/android
            chmod +x ./gradlew
            # Kotlin compiler uses same bounded memory verified in synthetic Android CI.
            ./gradlew :app:compileDebugKotlin -PfirebasePerformanceInstrumentationEnabled=false -Pkotlin.daemon.jvmargs=-Xmx1280m -Dorg.gradle.parallel=false --no-parallel --max-workers=1 --no-daemon --stacktrace
          no_output_timeout: 25m
      - run:
          name: Validate Android JVM tests and AndroidTest sources for signed release
          command: |
            set -euo pipefail
            cd apps/android
            ./gradlew testDebugUnitTest compileDebugAndroidTestSources -PfirebasePerformanceInstrumentationEnabled=false -Pkotlin.daemon.jvmargs=-Xmx1280m -Dorg.gradle.parallel=false --no-parallel --max-workers=1 --no-daemon --stacktrace
          no_output_timeout: 25m
      - run:
          name: Build and verify SIGNED release AAB (Crashlytics enabled)
          command: |
            set -euo pipefail
            cd apps/android
            # No Crashlytics task exclusions on real signed releases.
            ./gradlew bundleRelease -PfirebasePerformanceInstrumentationEnabled=false -Pkotlin.daemon.jvmargs=-Xmx1280m -Dorg.gradle.parallel=false --no-parallel --max-workers=1 --no-daemon --stacktrace
            aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -size +0c -print -quit)"
            test -n "$aab"
            jarsigner -verify "$aab" | grep -F 'jar verified.'
            sha256sum "$aab"
          no_output_timeout: 25m
      - run:
          name: Update deployment status to failed
          command: circleci run release update --status=FAILED
          when: on_fail
      - run:
          name: Android failure diagnostics (cgroup memory only; no secrets)
          when: on_fail
          command: |
            echo 'Android build failed. Consult the Gradle error above.'
            for path in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max; do
              if [ -r "$path" ]; then
                printf '%s\n' "$path"
                cat "$path"
              fi
            done
      - persist_to_workspace:
          root: .
          paths:
            - apps/android/app/build/outputs/bundle/release
  cancel-android_release_bundle:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update android_release_bundle \
              --status=CANCELED

  production_pages_deploy:
    docker:
      - image: cimg/node:22.15.0
    resource_class: medium
    environment:
      CI: "true"
      HUSKY: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COMPONENT_NAME: "<< pipeline.deploy.component_name >>"
      ENVIRONMENT_NAME: "<< pipeline.deploy.environment_name >>"
      NAMESPACE: "<< pipeline.deploy.namespace >>"
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
    steps:
      - checkout
      - run:
          name: Verify production credentials and main branch guard (without printing secrets)
          command: |
            set -euo pipefail
            [[ "${CIRCLE_BRANCH:-}" == "main" ]] || {
              echo "NO-GO: production deployment is restricted to main"; exit 1;
            }
            [[ "$(git rev-parse HEAD)" == "${CIRCLE_SHA1:-}" ]] || {
              echo "NO-GO: checkout SHA does not match CircleCI pipeline SHA"; exit 1;
            }
            export PUBLIC_SUPABASE_URL="${PUBLIC_SUPABASE_URL:-${AUTAMEDICA_SUPABASE_URL:-https://qxjjrpksmwwrmubhvjew.supabase.co}}"
            export PUBLIC_SUPABASE_ANON_KEY="${PUBLIC_SUPABASE_ANON_KEY:-${AUTAMEDICA_SUPABASE_ANON_KEY:-}}"
            export PUBLIC_SIGNALING_URL="${PUBLIC_SIGNALING_URL:-wss://autamedica-http-signaling-server.marques-eduardo95466020.workers.dev/signaling}"
            export PUBLIC_APP_URL="${PUBLIC_APP_URL:-https://www.autamedica.com}"
            export RENAPDIS_RL_NUMBER="${RENAPDIS_RL_NUMBER:-RL-2026-47574120-APN-SSVEIYES#MS}"
            missing=0
            for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUBLIC_SUPABASE_URL PUBLIC_SUPABASE_ANON_KEY; do
              if [[ -z "${!key:-}" ]]; then
                echo "MISSING_REQUIRED_VARIABLE: ${key}"
                missing=1
              else
                echo "PRESENT_VARIABLE: ${key}"
              fi
            done
            if [[ "${missing}" -ne 0 ]]; then
              echo "NO-GO: One or more required CircleCI environment variables are missing. Configure them in CircleCI Project Settings -> Environment Variables."
              exit 1
            fi
      - run:
          name: Install locked workspace dependencies
          command: |
            corepack enable
            corepack prepare pnpm@9.15.2 --activate
            pnpm install --frozen-lockfile
          no_output_timeout: 15m
      - run:
          name: Build workspace core packages and @autamedica/web (apps/web -> dist)
          command: |
            export PUBLIC_GA4_MEASUREMENT_ID="G-YRN6QY3BTY"
            export PUBLIC_SUPABASE_URL="${PUBLIC_SUPABASE_URL:-${AUTAMEDICA_SUPABASE_URL:-https://qxjjrpksmwwrmubhvjew.supabase.co}}"
            export PUBLIC_SUPABASE_ANON_KEY="${PUBLIC_SUPABASE_ANON_KEY:-${AUTAMEDICA_SUPABASE_ANON_KEY:-}}"
            export PUBLIC_SIGNALING_URL="${PUBLIC_SIGNALING_URL:-wss://autamedica-http-signaling-server.marques-eduardo95466020.workers.dev/signaling}"
            export PUBLIC_APP_URL="${PUBLIC_APP_URL:-https://www.autamedica.com}"
            export PUBLIC_PATIENTS_URL="https://paciente.autamedica.com"
            export PUBLIC_DOCTORS_URL="https://doctor.autamedica.com"
            export PUBLIC_COMPANIES_URL="https://empresa.autamedica.com"
            export PUBLIC_ADMIN_URL="https://autamedica-admin.pages.dev"
            export RENAPDIS_RL_NUMBER="${RENAPDIS_RL_NUMBER:-RL-2026-47574120-APN-SSVEIYES#MS}"
            pnpm build:packages:core
            pnpm --filter @autamedica/web build
            test -d apps/web/dist
            test -f apps/web/dist/_worker.js/index.js -o -d apps/web/dist/_astro
          no_output_timeout: 20m
      - run:
          name: Plan release
          command: |
            circleci run release plan \
              --environment-name=${ENVIRONMENT_NAME} \
              --namespace=${NAMESPACE} \
              --component-name=${COMPONENT_NAME} \
              --target-version=${TARGET_VERSION}
      - run:
          name: Deploy all five Cloudflare Pages production projects via Wrangler
          working_directory: apps/web
          command: |
            set -euo pipefail
            snapshots='{}'
            projects=(autamedica-web autamedica-doctors autamedica-patients autamedica-companies autamedica-admin)
            for project in "${projects[@]}"; do
              response=$(curl --fail --silent --show-error --max-time 30 \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
              prev_id=$(printf '%s' "${response}" | jq -er 'select(.success == true) | .result.canonical_deployment.id | select(type == "string" and length > 0)')
              snapshots=$(printf '%s' "${snapshots}" | jq -c --arg project "${project}" --arg id "${prev_id}" '. + {($project): $id}')
              echo "Snapshot ${project} previous canonical deployment: ${prev_id}"
            done
            for project in "${projects[@]}"; do
              echo "Deploying ${project} from apps/web/dist to branch main..."
              npx wrangler pages deploy dist --project-name="${project}" --branch=main --commit-hash="${CIRCLE_SHA1}" --commit-dirty=false
              response=$(curl --fail --silent --show-error --max-time 30 \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
              new_id=$(printf '%s' "${response}" | jq -er 'select(.success == true) | .result.canonical_deployment.id | select(type == "string" and length > 0)')
              echo "DEPLOYED_PROJECT=${project} DEPLOYMENT_ID=${new_id} COMMIT=${CIRCLE_SHA1}"
            done
          no_output_timeout: 20m
      - run:
          name: Post-deploy smoke verification of all production domains and PKCE bundle
          command: |
            set -euo pipefail
            sleep 15
            for url in \
              https://www.autamedica.com \
              https://autamedica.com \
              https://auth.autamedica.com \
              https://paciente.autamedica.com \
              https://doctor.autamedica.com \
              https://empresa.autamedica.com \
              https://autamedica-admin.pages.dev
            do
              status=$(curl -so /dev/null -w '%{http_code}' -L --max-time 30 "${url}")
              echo "${url}: HTTP ${status}"
              [[ "${status}" == "200" || "${status}" == "302" ]]
            done
            status_404=$(curl -so /dev/null -w '%{http_code}' --max-time 30 "https://www.autamedica.com/nonexistent-$(date +%s).js")
            [[ "${status_404}" == "404" ]]
            for origin in https://www.autamedica.com https://autamedica-admin-5r9.pages.dev; do
              lic_status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' \
                --data '{"doctorId":"00000000-0000-0000-0000-000000000000","persist":false}' \
                "${origin}/api/admin/doctors/license-verify-live")
              echo "${origin} license verification: HTTP ${lic_status}"
              [[ "${lic_status}" == "401" ]]
            done
            reset_html=$(curl --fail --silent --show-error -L --max-time 30 "https://www.autamedica.com/auth/reset-password")
            reset_js_path=$(printf '%s' "${reset_html}" | grep -oE '/_astro/ResetPasswordForm\.[A-Za-z0-9_-]+\.js' | sed -n '1p')
            echo "Live ResetPasswordForm bundle: ${reset_js_path}"
            test -n "${reset_js_path}"
            reset_js=$(curl --fail --silent --show-error -L --max-time 30 "https://www.autamedica.com${reset_js_path}")
            printf '%s' "${reset_js}" | grep -F "token_hash" >/dev/null
            printf '%s' "${reset_js}" | grep -F "verifyOtp" >/dev/null
            echo "VERIFIED: Live production ResetPasswordForm bundle includes PKCE and scanner-safe token_hash recovery."
      - run:
          name: Update deployment status to failed
          command: circleci run release update --status=FAILED
          when: on_fail
  cancel-production_pages_deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update production_pages_deploy \
              --status=CANCELED
  production_pages_deploy-release:
    type: release
    plan_name: production_pages_deploy
    validation:
      enabled: true
      auto_rollback_on_failure: true
  android_release_bundle-release:
    type: release
    plan_name: android_release_bundle
    validation:
      enabled: true
      auto_rollback_on_failure: true


workflows:
  deploy:
    jobs:
      - android_release_bundle:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^android-v[0-9]+\.[0-9]+\.[0-9]+(-rc[1-9][0-9]*)?$/
      - android_release_bundle-release:
          requires:
            - android_release_bundle
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^android-v[0-9]+\.[0-9]+\.[0-9]+(-rc[1-9][0-9]*)?$/
      - cancel-android_release_bundle:
          requires:
            - android_release_bundle
      - production_pages_deploy:
          filters:
            branches:
              only: main
      - production_pages_deploy-release:
          requires:
            - production_pages_deploy
          filters:
            branches:
              only: main
      - cancel-production_pages_deploy:
          requires:
            - production_pages_deploy