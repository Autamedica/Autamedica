<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definiciones de Estilos y Filtros -->
  <defs>
    <filter id="premium-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#78716c" />
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="600" fill="#FAF9F6" rx="24"/>

  <!-- Título y Subtítulo -->
  <text x="600" y="60" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#1c1917">Ciclo de Combate al No-Show</text>
  <text x="600" y="90" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="500" fill="#78716c">Arquitectura de Eficiencia Clínica — AutaMedica</text>

  <!-- 1. PREVENCIÓN -->
  <g transform="translate(50, 150)">
    <rect width="240" height="320" rx="20" fill="white" filter="url(#premium-shadow)"/>
    <rect width="240" height="10" rx="10" fill="#0ea5e9"/>
    <text x="120" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#0ea5e9" letter-spacing="1">1. PREVENCIÓN</text>
    <circle cx="120" cy="100" r="35" fill="#f0f9ff"/>
    <path d="M110 95 L120 105 L140 85" stroke="#0ea5e9" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <text x="120" y="165" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c1917">WhatsApp Activo</text>
    <text x="20" y="195" font-family="sans-serif" font-size="12" fill="#57534e">
      <tspan x="120" dy="0" text-anchor="middle">Recordatorios a las 24h y 2h.</tspan>
      <tspan x="120" dy="18" text-anchor="middle">El paciente confirma o cancela</tspan>
      <tspan x="120" dy="18" text-anchor="middle">desde el chat en un clic.</tspan>
    </text>
    <rect x="40" y="260" width="160" height="32" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="281" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#047857">REDUCCIÓN DE OLVIDO</text>
  </g>

  <!-- 2. DETECCIÓN -->
  <g transform="translate(330, 150)">
    <rect width="240" height="320" rx="20" fill="white" filter="url(#premium-shadow)"/>
    <rect width="240" height="10" rx="10" fill="#f59e0b"/>
    <text x="120" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#f59e0b" letter-spacing="1">2. DETECCIÓN</text>
    <circle cx="120" cy="100" r="35" fill="#fffbeb"/>
    <path d="M105 100 Q120 80 135 100 Q120 120 105 100" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <circle cx="120" cy="100" r="5" fill="#f59e0b"/>
    
    <text x="120" y="165" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c1917">Reaper Automático</text>
    <text x="20" y="195" font-family="sans-serif" font-size="12" fill="#57534e">
      <tspan x="120" dy="0" text-anchor="middle">Si el paciente no asiste,</tspan>
      <tspan x="120" dy="18" text-anchor="middle">el sistema marca "Ausente"</tspan>
      <tspan x="120" dy="18" text-anchor="middle">tras 30 min de gracia.</tspan>
    </text>
    <rect x="40" y="260" width="160" height="32" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
    <text x="120" y="281" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#9a3412">LIMPIEZA DE AGENDA</text>
  </g>

  <!-- 3. RECUPERACIÓN -->
  <g transform="translate(610, 150)">
    <rect width="240" height="320" rx="20" fill="white" filter="url(#premium-shadow)"/>
    <rect width="240" height="10" rx="10" fill="#10b981"/>
    <text x="120" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#10b981" letter-spacing="1">3. RECUPERACIÓN</text>
    <circle cx="120" cy="100" r="35" fill="#f0fdf4"/>
    <path d="M100 100 L140 100 M120 80 L120 120" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    
    <text x="120" y="165" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c1917">Waitlist Match</text>
    <text x="20" y="195" font-family="sans-serif" font-size="12" fill="#57534e">
      <tspan x="120" dy="0" text-anchor="middle">Al cancelar, se ofrece el lugar</tspan>
      <tspan x="120" dy="18" text-anchor="middle">a pacientes en espera via SMS.</tspan>
      <tspan x="120" dy="18" text-anchor="middle">Huecos llenos en minutos.</tspan>
    </text>
    <rect x="40" y="260" width="160" height="32" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="120" y="281" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">SLOTS RECLAMADOS</text>
  </g>

  <!-- 4. INTELIGENCIA -->
  <g transform="translate(890, 150)">
    <rect width="240" height="320" rx="20" fill="white" filter="url(#premium-shadow)"/>
    <rect width="240" height="10" rx="10" fill="#8b5cf6"/>
    <text x="120" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#8b5cf6" letter-spacing="1">4. INTELIGENCIA</text>
    <circle cx="120" cy="100" r="35" fill="#f5f3ff"/>
    <path d="M105 110 L115 90 L125 105 L135 85" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <text x="120" y="165" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c1917">Predicción de IA</tspan>
    <text x="20" y="195" font-family="sans-serif" font-size="12" fill="#57534e">
      <tspan x="120" dy="0" text-anchor="middle">Calcula probabilidad de falta.</tspan>
      <tspan x="120" dy="18" text-anchor="middle">Si el riesgo es > 30%, permite</tspan>
      <tspan x="120" dy="18" text-anchor="middle">overbooking inteligente.</tspan>
    </text>
    <rect x="40" y="260" width="160" height="32" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1"/>
    <text x="120" y="281" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#6d28d9">OVERBOOKING SEGURO</text>
  </g>

  <!-- Flechas de Conexión -->
  <line x1="290" y1="310" x2="330" y2="310" stroke="#78716c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="310" x2="610" y2="310" stroke="#78716c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="850" y1="310" x2="890" y2="310" stroke="#78716c" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Línea de Retorno (Loop) -->
  <path d="M 1010 470 Q 1010 540 600 540 Q 170 540 170 470" fill="none" stroke="#78716c" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="600" y="530" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#78716c">Retroalimentación de datos para aprendizaje continuo</text>

  <!-- Legend / Footer -->
  <g transform="translate(50, 560)">
    <rect width="1100" height="30" rx="8" fill="#f5f5f4"/>
    <text x="550" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#a8a29e">SISTEMA INTEGRADO: PREVENIR → DETECTAR → RECUPERAR → OPTIMIZAR</text>
  </g>
</svg>
