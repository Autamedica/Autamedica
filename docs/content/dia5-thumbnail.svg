<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="sysGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg5)"/>
  <rect width="1080" height="1920" fill="url(#sysGlow)"/>

  <!-- Grid/dots pattern -->
  <g opacity="0.04">
    <pattern id="gridDots" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1.5" fill="#0ea5e9"/>
    </pattern>
    <rect width="1080" height="1920" fill="url(#gridDots)"/>
  </g>

  <!-- Fine grid lines -->
  <g opacity="0.025" stroke="#0ea5e9" stroke-width="0.5">
    <line x1="0" y1="200" x2="1080" y2="200"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="600" x2="1080" y2="600"/>
    <line x1="0" y1="800" x2="1080" y2="800"/>
    <line x1="0" y1="1000" x2="1080" y2="1000"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
    <line x1="0" y1="1400" x2="1080" y2="1400"/>
    <line x1="0" y1="1600" x2="1080" y2="1600"/>
    <line x1="200" y1="0" x2="200" y2="1920"/>
    <line x1="400" y1="0" x2="400" y2="1920"/>
    <line x1="600" y1="0" x2="600" y2="1920"/>
    <line x1="800" y1="0" x2="800" y2="1920"/>
  </g>

  <!-- Top accent -->
  <rect x="0" y="80" width="1080" height="2" fill="url(#accentLine5)"/>

  <!-- Calendar emoji -->
  <text x="540" y="330" font-family="'Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="180" text-anchor="middle" fill="white">📅</text>

  <!-- Calendar grid visual -->
  <g transform="translate(240, 400)">
    <!-- Grid boxes (7 cols x 4 rows) -->
    <g opacity="0.15">
      <!-- Row 1 -->
      <rect x="0" y="0" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="85" y="0" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="170" y="0" width="75" height="50" rx="4" fill="#ef4444" opacity="0.5" stroke="#ef4444" stroke-width="0.5"/>
      <rect x="255" y="0" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="340" y="0" width="75" height="50" rx="4" fill="#0ea5e9" opacity="0.4" stroke="#0ea5e9" stroke-width="0.5"/>
      <rect x="425" y="0" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="510" y="0" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <!-- Row 2 -->
      <rect x="0" y="60" width="75" height="50" rx="4" fill="#0ea5e9" opacity="0.3" stroke="#0ea5e9" stroke-width="0.5"/>
      <rect x="85" y="60" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="170" y="60" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="255" y="60" width="75" height="50" rx="4" fill="#ef4444" opacity="0.4" stroke="#ef4444" stroke-width="0.5"/>
      <rect x="340" y="60" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="425" y="60" width="75" height="50" rx="4" fill="#0ea5e9" opacity="0.5" stroke="#0ea5e9" stroke-width="0.5"/>
      <rect x="510" y="60" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <!-- Row 3 -->
      <rect x="0" y="120" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="85" y="120" width="75" height="50" rx="4" fill="#ef4444" opacity="0.3" stroke="#ef4444" stroke-width="0.5"/>
      <rect x="170" y="120" width="75" height="50" rx="4" fill="#0ea5e9" opacity="0.4" stroke="#0ea5e9" stroke-width="0.5"/>
      <rect x="255" y="120" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="340" y="120" width="75" height="50" rx="4" fill="#525252" stroke="#333" stroke-width="0.5"/>
      <rect x="425" y="120" width="75" height="50" rx="4" fill="#ef4444" opacity="0.4" stroke="#ef4444" stroke-width="0.5"/>
      <rect x="510" y="120" width="75" height="50" rx="4" fill="#0ea5e9" opacity="0.3" stroke="#0ea5e9" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Divider -->
  <rect x="0" y="660" width="1080" height="2" fill="url(#accentLine5)" opacity="0.5"/>

  <!-- Main text -->
  <text x="540" y="830" font-family="Inter,system-ui,sans-serif" font-size="88" font-weight="400" text-anchor="middle" fill="white" letter-spacing="-2">La agenda no</text>
  <text x="540" y="945" font-family="Inter,system-ui,sans-serif" font-size="88" font-weight="400" text-anchor="middle" fill="white" letter-spacing="-2">estaba llena</text>

  <!-- Accent text -->
  <text x="540" y="1080" font-family="Inter,system-ui,sans-serif" font-size="56" font-weight="600" text-anchor="middle" fill="#0ea5e9" letter-spacing="1">Estaba mal orquestada</text>

  <!-- Divider -->
  <rect x="340" y="1150" width="400" height="1" fill="#ffffff" opacity="0.1"/>

  <!-- Three blocks: ANTES | DURANTE | DESPUES -->
  <g transform="translate(0, 1220)">
    <!-- ANTES -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="260" height="320" rx="12" fill="url(#blockGrad)" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
      <text x="130" y="50" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#0ea5e9" letter-spacing="3">ANTES</text>
      <rect x="30" y="80" width="200" height="2" fill="#0ea5e9" opacity="0.15"/>
      <!-- Content indicators -->
      <rect x="30" y="110" width="140" height="16" rx="3" fill="#525252" opacity="0.3"/>
      <rect x="30" y="140" width="180" height="16" rx="3" fill="#525252" opacity="0.2"/>
      <rect x="30" y="170" width="100" height="16" rx="3" fill="#525252" opacity="0.25"/>
      <rect x="30" y="210" width="160" height="16" rx="3" fill="#0ea5e9" opacity="0.1"/>
      <rect x="30" y="240" width="120" height="16" rx="3" fill="#0ea5e9" opacity="0.08"/>
      <text x="130" y="295" font-family="Inter,system-ui,sans-serif" font-size="20" text-anchor="middle" fill="#525252">Admisión</text>
    </g>

    <!-- DURANTE -->
    <g transform="translate(410, 0)">
      <rect x="0" y="0" width="260" height="320" rx="12" fill="url(#blockGrad)" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
      <text x="130" y="50" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#0ea5e9" letter-spacing="3">DURANTE</text>
      <rect x="30" y="80" width="200" height="2" fill="#0ea5e9" opacity="0.2"/>
      <!-- Content indicators -->
      <rect x="30" y="110" width="180" height="16" rx="3" fill="#0ea5e9" opacity="0.15"/>
      <rect x="30" y="140" width="150" height="16" rx="3" fill="#0ea5e9" opacity="0.12"/>
      <rect x="30" y="170" width="200" height="16" rx="3" fill="#0ea5e9" opacity="0.1"/>
      <rect x="30" y="210" width="160" height="16" rx="3" fill="#0ea5e9" opacity="0.12"/>
      <rect x="30" y="240" width="120" height="16" rx="3" fill="#0ea5e9" opacity="0.1"/>
      <text x="130" y="295" font-family="Inter,system-ui,sans-serif" font-size="20" text-anchor="middle" fill="#a3a3a3">Consulta</text>
    </g>

    <!-- DESPUES -->
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="260" height="320" rx="12" fill="url(#blockGrad)" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
      <text x="130" y="50" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#0ea5e9" letter-spacing="3">DESPUÉS</text>
      <rect x="30" y="80" width="200" height="2" fill="#0ea5e9" opacity="0.15"/>
      <!-- Content indicators -->
      <rect x="30" y="110" width="160" height="16" rx="3" fill="#525252" opacity="0.3"/>
      <rect x="30" y="140" width="130" height="16" rx="3" fill="#525252" opacity="0.2"/>
      <rect x="30" y="170" width="190" height="16" rx="3" fill="#525252" opacity="0.15"/>
      <rect x="30" y="210" width="140" height="16" rx="3" fill="#0ea5e9" opacity="0.08"/>
      <rect x="30" y="240" width="170" height="16" rx="3" fill="#0ea5e9" opacity="0.06"/>
      <text x="130" y="295" font-family="Inter,system-ui,sans-serif" font-size="20" text-anchor="middle" fill="#525252">Seguimiento</text>
    </g>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="1700" width="1080" height="1" fill="url(#accentLine5)" opacity="0.4"/>

  <!-- Logo area -->
  <text x="540" y="1770" font-family="Inter,system-ui,sans-serif" font-size="38" font-weight="600" text-anchor="middle" fill="#0ea5e9" letter-spacing="6">AUTAMEDICA</text>
  <text x="540" y="1820" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#525252" letter-spacing="3">Admisión clínica inteligente</text>
</svg>