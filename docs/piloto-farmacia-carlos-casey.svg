<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>

  <rect width="1600" height="112" fill="url(#header)"/>
  <text x="80" y="48" font-size="30" font-weight="900" fill="#ffffff">AutaMedica + Farmacia Piloto</text>
  <text x="80" y="78" font-size="15" fill="#d1fae5">Receta electronica verificable, validacion farmaceutica y dispensa con auditoria</text>
  <g transform="translate(1220, 26)">
    <rect width="300" height="58" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="150" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">Demo para Director Tecnico</text>
    <text x="150" y="44" text-anchor="middle" font-size="12" fill="#bfdbfe">validar flujo real de farmacia</text>
  </g>

  <g transform="translate(80, 150)">
    <rect width="1440" height="86" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="28" y="34" font-size="17" font-weight="900" fill="#0f172a">Objetivo del piloto</text>
    <text x="28" y="60" font-size="14" fill="#334155">Probar con una farmacia real si el circuito es claro, verificable y util para dispensar recetas digitales sin llamadas ni coordinacion manual.</text>
    <text x="1085" y="35" font-size="13" font-weight="800" fill="#0f766e">Resultado buscado:</text>
    <text x="1085" y="59" font-size="13" fill="#334155">feedback operativo + demo controlada</text>
  </g>

  <!-- Main flow -->
  <g transform="translate(80, 300)">
    <rect width="230" height="160" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
    <circle cx="52" cy="48" r="26" fill="#dbeafe"/>
    <text x="52" y="57" text-anchor="middle" font-size="26">M</text>
    <text x="92" y="43" font-size="19" font-weight="900" fill="#1d4ed8">Medico</text>
    <text x="28" y="91" font-size="13" fill="#334155">Emite receta digital</text>
    <text x="28" y="116" font-size="13" fill="#334155">Firma como prescriptor</text>
    <text x="28" y="141" font-size="13" fill="#334155">Genera CUIR y QR</text>
  </g>

  <line x1="318" y1="380" x2="410" y2="380" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <g transform="translate(430, 280)">
    <rect width="280" height="200" rx="18" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="140" y="38" text-anchor="middle" font-size="19" font-weight="900" fill="#075985">Receta verificable</text>
    <rect x="42" y="62" width="78" height="78" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <rect x="56" y="76" width="16" height="16" fill="#075985"/>
    <rect x="90" y="76" width="16" height="16" fill="#075985"/>
    <rect x="56" y="110" width="16" height="16" fill="#075985"/>
    <path d="M86 108 h20 v18 h-20 z M82 94 h12 v12 h-12 z M104 98 h8 v8 h-8 z" fill="#075985"/>
    <text x="144" y="82" font-size="13" fill="#334155">QR publico</text>
    <text x="144" y="108" font-size="13" fill="#334155">CUIR unico</text>
    <text x="144" y="134" font-size="13" fill="#334155">PDF firmado</text>
    <line x1="36" y1="158" x2="244" y2="158" stroke="#e2e8f0"/>
    <text x="140" y="181" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">/verify/[cuir]</text>
  </g>

  <line x1="720" y1="380" x2="812" y2="380" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(830, 300)">
    <rect width="230" height="160" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
    <circle cx="52" cy="48" r="26" fill="#dcfce7"/>
    <text x="52" y="57" text-anchor="middle" font-size="26">P</text>
    <text x="92" y="43" font-size="19" font-weight="900" fill="#166534">Paciente</text>
    <text x="28" y="91" font-size="13" fill="#14532d">Recibe QR/link</text>
    <text x="28" y="116" font-size="13" fill="#14532d">Lo presenta en farmacia</text>
    <text x="28" y="141" font-size="13" fill="#14532d">Ve estado de dispensa</text>
  </g>

  <line x1="1070" y1="380" x2="1162" y2="380" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(1180, 270)">
    <rect width="340" height="220" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
    <text x="170" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="#064e3b">Farmacia / Director Tecnico</text>
    <text x="34" y="74" font-size="13" fill="#064e3b">Escanea o abre el QR</text>
    <text x="34" y="102" font-size="13" fill="#064e3b">Verifica medico, paciente y medicamento</text>
    <text x="34" y="130" font-size="13" fill="#064e3b">Valida vigencia y datos obligatorios</text>
    <text x="34" y="158" font-size="13" fill="#064e3b">Marca dispensa parcial o total</text>
    <text x="34" y="186" font-size="13" fill="#064e3b">La receta queda bloqueada contra reuso</text>
  </g>

  <!-- Validation band -->
  <g transform="translate(80, 560)">
    <rect width="1440" height="138" rx="18" fill="#0f172a" filter="url(#shadow)"/>
    <text x="34" y="38" font-size="20" font-weight="900" fill="#ffffff">Que queremos validar con Carlos</text>

    <g transform="translate(34, 62)">
      <rect width="260" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="18" y="21" font-size="12" font-weight="800" fill="#dbeafe">1. Datos necesarios</text>
      <text x="18" y="38" font-size="11" fill="#cbd5e1">que ve la farmacia antes de dispensar</text>
    </g>

    <g transform="translate(322, 62)">
      <rect width="260" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="18" y="21" font-size="12" font-weight="800" fill="#dbeafe">2. Controlados</text>
      <text x="18" y="38" font-size="11" fill="#cbd5e1">psicotropicos, estupefacientes, archivo</text>
    </g>

    <g transform="translate(610, 62)">
      <rect width="260" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="18" y="21" font-size="12" font-weight="800" fill="#dbeafe">3. Dispensa real</text>
      <text x="18" y="38" font-size="11" fill="#cbd5e1">parcial, total, lote, vencimiento</text>
    </g>

    <g transform="translate(898, 62)">
      <rect width="260" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="18" y="21" font-size="12" font-weight="800" fill="#dbeafe">4. Auditoria</text>
      <text x="18" y="38" font-size="11" fill="#cbd5e1">quien hizo que y cuando</text>
    </g>

    <g transform="translate(1186, 62)">
      <rect width="220" height="50" rx="12" fill="#052e16" stroke="#16a34a"/>
      <text x="18" y="21" font-size="12" font-weight="800" fill="#dcfce7">5. Piloto</text>
      <text x="18" y="38" font-size="11" fill="#bbf7d0">demo controlada en farmacia</text>
    </g>
  </g>

  <!-- Benefits -->
  <g transform="translate(80, 750)">
    <rect width="690" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="30" y="36" font-size="18" font-weight="900" fill="#0f172a">Para la farmacia</text>
    <text x="30" y="70" font-size="13" fill="#334155">Menos llamadas para confirmar recetas.</text>
    <text x="30" y="96" font-size="13" fill="#334155">Validacion clara antes de dispensar.</text>
    <text x="30" y="122" font-size="13" fill="#334155">Trazabilidad para Director Tecnico y equipo.</text>
  </g>

  <g transform="translate(830, 750)">
    <rect width="690" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="30" y="36" font-size="18" font-weight="900" fill="#0f172a">Para AutaMedica</text>
    <text x="30" y="70" font-size="13" fill="#334155">Probar el flujo con criterio farmaceutico real.</text>
    <text x="30" y="96" font-size="13" fill="#334155">Ajustar pantalla, datos y controles antes del go-live.</text>
    <text x="30" y="122" font-size="13" fill="#334155">Generar evidencia para recetario, validador y dispensa.</text>
  </g>

  <g transform="translate(80, 930)">
    <text x="0" y="0" font-size="12" fill="#64748b">Siguiente paso: llamada de 20 minutos + demo guiada + feedback operativo del Director Tecnico.</text>
  </g>
</svg>
