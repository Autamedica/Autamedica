# Auto-labeler configuration for Autamedica
# Compatible with actions/labeler@v5

frontend:
- changed-files:
  - any-glob-to-any-file:
    - apps/**
    - '**/*.tsx'
    - '**/*.css'
    - '**/*.scss'
    - '**/components/**'
    - '**/ui/**'
backend:
- changed-files:
  - any-glob-to-any-file:
    - packages/**
    - '**/*.api.ts'
    - '**/server/**'
    - '**/api/**'
    - workers/**
infra:
- changed-files:
  - any-glob-to-any-file:
    - .github/**
    - wrangler.toml
    - turbo.json
    - '**/deployment/**'
    - '**/*deploy*'
    - '**/*ci*'
    - '**/*cd*'
docs:
- changed-files:
  - any-glob-to-any-file:
    - docs/**
    - '**/*.md'
    - '**/*.mdx'
    - '**/README*'
testing:
- changed-files:
  - any-glob-to-any-file:
    - '**/*.test.*'
    - '**/*.spec.*'
    - tests/**
    - '**/test/**'
    - playwright.config.*
    - vitest.config.*
security:
- changed-files:
  - any-glob-to-any-file:
    - '**/*.env*'
    - '**/auth/**'
    - '**/security/**'
    - SECURITY.md
    - '**/*security*'
    - '**/*auth*'
medical:
- changed-files:
  - any-glob-to-any-file:
    - '**/medical/**'
    - '**/patient/**'
    - '**/doctor/**'
    - '**/hipaa/**'
    - '**/*medical*'
    - '**/*patient*'
    - '**/*doctor*'
config:
- changed-files:
  - any-glob-to-any-file:
    - '**/*.config.*'
    - '**/*.json'
    - '**/*.toml'
    - '**/*.yaml'
    - '**/*.yml'
    - .gitignore
    - .env*
dependencies:
- changed-files:
  - any-glob-to-any-file:
    - package.json
    - pnpm-lock.yaml
    - '**/package.json'
types:
- changed-files:
  - any-glob-to-any-file:
    - packages/types/**
    - '**/*.types.ts'
    - '**/*.d.ts'
    - '**/types/**'
web-app:
- changed-files:
  - any-glob-to-any-file:
    - apps/web-app/**
doctors-app:
- changed-files:
  - any-glob-to-any-file:
    - apps/doctors/**
patients-app:
- changed-files:
  - any-glob-to-any-file:
    - apps/patients/**
companies-app:
- changed-files:
  - any-glob-to-any-file:
    - apps/companies/**
admin-app:
- changed-files:
  - any-glob-to-any-file:
    - apps/admin/**
auth-package:
- changed-files:
  - any-glob-to-any-file:
    - packages/auth/**
shared-package:
- changed-files:
  - any-glob-to-any-file:
    - packages/shared/**
hooks-package:
- changed-files:
  - any-glob-to-any-file:
    - packages/hooks/**
ui-package:
- changed-files:
  - any-glob-to-any-file:
    - packages/ui/**
