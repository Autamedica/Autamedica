name: One-time AutaMedica Google Play release 1.2.20

# Explicitly authorized once on 2026-11-05 for production release.
# Only operates in this temporary branch, never on main.
# No automatic release on future main pushes.
on:
  push:
    branches:
      - release/playstore-1-2-20-once-20261105
    paths:
      - .github/workflows/playstore-1-2-20-once-20261105.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: once-play-1-2-20-code30
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified 1.2.20 (30) to Google Play production
    if: ${{ github.event.head_commit.message == 'release(play): publish verified 1.2.20 code30 to production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify Google Play service account is configured
        env:
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Google Play upload unavailable: GOOGLE_PLAY_SERVICE_ACCOUNT secret missing."
            exit 1
          fi

      - name: Download already built and signed AAB from reviewed main commit
        uses: actions/download-artifact@v4
        with:
          repository: ecucondorSA/Autamedica
          run-id: 42006583134
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: autamedica-release-v1.2.20-code30
          path: ./aab

      - name: Validate trusted bundle and intended release
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          bundles = glob.glob('aab/*.aab')
          if len(bundles) != 1:
              sys.exit(f'Expected exactly one signed AAB artifact; found {len(bundles)}')
          bundle = bundles[0]
          with zipfile.ZipFile(bundle) as archive:
              bad = archive.testzip()
              if bad is not None:
                  sys.exit(f'Corrupt bundle member: {bad}')
          print(f'Validated trusted AAB artifact: {bundle}')
          print('Source main commit: 543fc9d9fd48c60aee99b609bc143c3880e000a7')
          print('Target version: 1.2.20 (versionCode 30), package com.autamedica.android')
          PY

      - name: Verify versionCode 30 is newer than all Play tracks
        env:
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          pip install --disable-pip-version-check --quiet google-auth
          python3 - <<'PY'
          import json
          import os
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account

          expected_package = "com.autamedica.android"
          expected_version_code = 30
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SERVICE_ACCOUNT"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          session = AuthorizedSession(creds)
          api = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{expected_package}"
          response = session.post(f"{api}/edits")
          response.raise_for_status()
          edit_id = response.json()["id"]
          max_code = 0
          try:
              for track in ("internal", "alpha", "beta", "production"):
                  result = session.get(f"{api}/edits/{edit_id}/tracks/{track}")
                  if result.status_code == 404:
                      continue
                  result.raise_for_status()
                  codes = [
                      int(code)
                      for release in result.json().get("releases", [])
                      for code in release.get("versionCodes", [])
                  ]
                  max_code = max(max_code, max(codes, default=0))
                  print(f"{track}: highest deployed versionCode={max(codes, default=0)}")
          finally:
              session.delete(f"{api}/edits/{edit_id}")
          print(f"Newest deployed versionCode across tracks: {max_code}")
          if expected_version_code <= max_code:
              raise SystemExit(
                  f"Publication blocked: code {expected_version_code} is not newer than {max_code}. "
                  "No upload performed."
              )
          print("Version gate passed; ready for production upload")
          PY

      - name: Upload to Google Play production
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.autamedica.android
          releaseFiles: ./aab/*.aab
          tracks: production
          status: completed

      - name: Record publication result
        run: |
          echo '## Google Play production submission' >> "$GITHUB_STEP_SUMMARY"
          echo '- App: com.autamedica.android' >> "$GITHUB_STEP_SUMMARY"
          echo '- Version: 1.2.20 (versionCode 30)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Track: production' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source: main 543fc9d9fd48c60aee99b609bc143c3880e000a7' >> "$GITHUB_STEP_SUMMARY"
          echo '- Google Play may still require review before public availability.' >> "$GITHUB_STEP_SUMMARY"
