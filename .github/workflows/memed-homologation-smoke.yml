name: Memed homologation live smoke (official test environment)

on:
  push:
    branches: [test/memed-demo-e2e-20261103]
    paths:
      - 'scripts/memed-homologation-smoke.mjs'
      - '.github/workflows/memed-homologation-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sandbox-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MEMED_HOMO_REGISTER_DEMO: 'false'
      MEMED_HOMO_VALIDATE_DEMO: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate sandbox credentials, CFM and existing AutaMedica DEMO identity (read only)
        run: node scripts/memed-homologation-smoke.mjs
