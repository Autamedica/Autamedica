name: DB Type Drift Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'packages/types/src/supabase/**'
      - 'packages/shared/src/types/database.types.ts'

permissions:
  contents: read

concurrency:
  group: db-drift-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.2'

jobs:
  db-type-drift:
    name: 🗄️ DB Type Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Supabase CLI
        run: |
          curl -sSL https://cli.supabase.com/install.sh | sh
          supabase --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate fresh types from production DB
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript \
            --project-id qxjjrpksmwwrmubhvjew \
            > /tmp/fresh-database.types.ts

      - name: Post-process generated types
        run: |
          cp /tmp/fresh-database.types.ts packages/types/src/supabase/database.types.ts
          cp /tmp/fresh-database.types.ts packages/shared/src/types/database.types.ts
          npx tsx scripts/postprocess-db-types.ts

      - name: Check for type drift
        run: |
          if git diff --exit-code -- \
            packages/types/src/supabase/database.types.ts \
            packages/shared/src/types/database.types.ts; then
            echo "✅ No type drift detected"
          else
            echo ""
            echo "❌ DB Type Drift Detected!"
            echo ""
            echo "The database schema has changed but types were not regenerated."
            echo "Run: pnpm types:db:gen"
            echo ""
            echo "Then commit the updated database.types.ts files."
            exit 1
          fi

      - name: Build packages with fresh types
        run: pnpm build:packages:core

      - name: Typecheck all apps against fresh types
        run: pnpm check:all
