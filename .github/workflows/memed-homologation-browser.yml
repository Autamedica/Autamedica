name: Memed homologation browser — demo patient

on:
  push:
    branches:
      - test/memed-sandbox-rx-ui-20261103
    paths:
      - 'scripts/memed-homologation-browser.mjs'
      - '.github/workflows/memed-homologation-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  sandbox-api-preflight:
    name: Check Memed homologation credentials and owned DEMO identity
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      MEMED_HOMO_REGISTER_DEMO: 'false'
      MEMED_HOMO_VALIDATE_DEMO: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify sandbox credentials and own DEMO prescriber (no mutation)
        run: node scripts/memed-homologation-smoke.mjs
  sandbox-browser:
    name: Real Memed homologation SDK, no Rx issued
    needs: sandbox-api-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '9.15.2'
      - name: Install isolated Chromium for sandbox E2E
        run: pnpm exec playwright install chromium --with-deps
      - name: Open Memed sandbox SDK with owned DEMO doctor and set DEMO patient
        run: node scripts/memed-homologation-browser.mjs
