name: CI/CD Monorepo

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
      apps: ${{ steps.changes.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: changes
        run: |
          # Detectar cambios en packages
          if git diff --name-only HEAD~1 | grep -q "^packages/"; then
            echo "packages=true" >> $GITHUB_OUTPUT
          else
            echo "packages=false" >> $GITHUB_OUTPUT
          fi

          # Detectar cambios en apps
          if git diff --name-only HEAD~1 | grep -q "^apps/"; then
            echo "apps=true" >> $GITHUB_OUTPUT
          else
            echo "apps=false" >> $GITHUB_OUTPUT
          fi

  build-packages:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Run package tests
        run: pnpm --filter "./packages/*" test:unit

      - name: Validate contracts
        run: pnpm docs:validate

  build-apps:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-packages]
    if: always() && (needs.detect-changes.outputs.apps == 'true' || needs.build-packages.result == 'success')
    strategy:
      matrix:
        app: [web, web-app, doctors, patients, companies]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages first
        run: pnpm build:packages

      - name: Lint app
        run: pnpm --filter @autamedica/${{ matrix.app }} lint

      - name: Type check app (Astro)
        if: matrix.app == 'web'
        run: pnpm --filter @autamedica/${{ matrix.app }} check

      - name: Type check app (Next.js)
        if: matrix.app != 'web'
        run: pnpm --filter @autamedica/${{ matrix.app }} type-check

      - name: Build app
        run: pnpm --filter @autamedica/${{ matrix.app }} build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run security audit
        run: |
          # Buscar credenciales hardcodeadas (excluir directorios de build y node_modules)
          echo "🔍 Scanning for hardcoded credentials..."
          if grep -r "eyJ[A-Za-z0-9_-]" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=.next \
            --exclude-dir=.open-next \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude-dir=.astro \
            --exclude-dir=.turbo \
            --exclude="*.md" \
            --exclude="*.map" \
            --exclude="*.js.map" \
            --exclude="*.log" \
            . 2>/dev/null && exit 1 || echo "✅ No hardcoded credentials found"

          # Verificar configuración de cookies
          echo "🍪 Checking cookie security..."
          if ! grep -r "httpOnly.*true" apps/*/middleware.ts; then
            echo "⚠️ Missing httpOnly cookies"
          fi

          echo "✅ Security scan passed"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-apps]
    if: github.ref == 'refs/heads/staging'
    strategy:
      matrix:
        app: [web-app, doctors, patients, companies]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: autamedica-${{ matrix.app }}-staging
          directory: apps/${{ matrix.app }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging-web:
    runs-on: ubuntu-latest
    needs: [build-apps]
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy web (Astro) to Cloudflare
        run: pnpm deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-apps, security-scan]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        app: [web-app, doctors, patients, companies]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  deploy-production-web:
    runs-on: ubuntu-latest
    needs: [build-apps, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

