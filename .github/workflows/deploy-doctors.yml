name: Deploy Doctors
on:
  push:
    branches: [main]
    paths:
      - "apps/doctors/**"
      - "packages/**"
      - ".github/workflows/deploy-doctors.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.15.2 }

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (including session)
        run: |
          pnpm build:packages:core
          cd packages/session && pnpm build && cd ../..

      - name: Build for Cloudflare (Next.js + OpenNext + Patches)
        working-directory: apps/doctors
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WEB_APP_URL: ${{ secrets.NEXT_PUBLIC_WEB_APP_URL }}
          NODE_ENV: production
        run: pnpm build:cloudflare

      - name: Deploy to Cloudflare Pages
        working-directory: apps/doctors
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          for project_name in "autamedica-doctors" "doctors" "autamedica-doctor"; do
            echo "Intentando deploy a Cloudflare Pages project: ${project_name}"
            for attempt in 1 2 3; do
              set +e
              DEPLOY_OUTPUT=$(pnpm dlx wrangler pages deploy .open-next \
                --project-name="${project_name}" \
                --branch=main \
                --commit-dirty=true 2>&1)
              DEPLOY_STATUS=$?
              set -e

              echo "$DEPLOY_OUTPUT"

              if [ $DEPLOY_STATUS -eq 0 ]; then
                echo "✅ Deploy exitoso en project: ${project_name}"
                exit 0
              fi

              if echo "$DEPLOY_OUTPUT" | grep -q "code: 10429"; then
                BACKOFF_SECONDS=$((attempt * 20))
                echo "⚠️ Cloudflare rate limit detectado. Reintento ${attempt}/3 en ${BACKOFF_SECONDS}s..."
                sleep "$BACKOFF_SECONDS"
                continue
              fi

              # Error no recuperable para este project_name (ej. project inexistente)
              break
            done
          done

          echo "❌ No se encontró un project válido para Doctors."
          echo "📋 Proyectos disponibles en la cuenta:"
          pnpm dlx wrangler pages project list || true
          exit 1

      - name: Link custom domain (doctors.autamedica.com)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          domain="doctors.autamedica.com"
          project="autamedica-doctors"
          http_code=$(curl -s -o /tmp/cf_domain_response.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${domain}\"}")

          if [ "${http_code}" = "200" ]; then
            echo "✅ ${domain}: vinculado exitosamente a ${project}"
            exit 0
          fi

          if [ "${http_code}" = "409" ]; then
            echo "✅ ${domain}: ya estaba vinculado"
            exit 0
          fi

          echo "⚠️ ${domain}: HTTP ${http_code}"
          cat /tmp/cf_domain_response.json || true
          exit 1
