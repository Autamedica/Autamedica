name: 📱 Android Release & Play Store (Auto-Triggered)

# Automated Android Release Pipeline
# Builds a signed AAB on Android changes and publishes successful main releases
# to Google Play production. Manual dispatch supports choosing the target track.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track'
        required: true
        default: 'production'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      upload_to_play_store:
        description: 'Upload to Google Play Console'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build-release-aab:
    name: Build Signed Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version_name: ${{ steps.version_info.outputs.version_name }}
      version_code: ${{ steps.version_info.outputs.version_code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_NAME=$(grep 'versionName' apps/android/app/build.gradle.kts | grep -oP '"\K[^"]+' | head -1)
          VERSION_CODE=$(grep 'versionCode' apps/android/app/build.gradle.kts | grep -o '[0-9]\+' | head -1)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📌 Building AutaMedica Android Version: $VERSION_NAME (Code: $VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing GitHub Actions secret: KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing GitHub Actions secret: KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing GitHub Actions secret: KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/android/autamedica-release.keystore
          test -s apps/android/autamedica-release.keystore
          chmod 600 apps/android/autamedica-release.keystore
          echo "Release keystore decoded"

      - name: Generate local.properties with Secrets
        run: |
          cd apps/android
          cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY }}
          SIGNALING_URL=${{ secrets.PUBLIC_SIGNALING_URL || 'wss://signaling.autamedica.com/signaling' }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          USE_LIVEKIT=false
          RELEASE_STORE_FILE=../autamedica-release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=autamedica
          RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "✅ local.properties generated"

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 -c "
          import os, json
          val = os.environ.get('GOOGLE_SERVICES_JSON', '')
          path = 'apps/android/app/google-services.json'
          if val.strip():
              with open(path, 'w') as f:
                  f.write(val)
              print('✅ google-services.json created from secret')
          elif not os.path.exists(path):
              dummy = {
                  'project_info': {'project_number': '653971537811', 'project_id': 'autamedica-e54fa', 'storage_bucket': 'autamedica-e54fa.firebasestorage.app'},
                  'client': [{'client_info': {'mobilesdk_app_id': '1:653971537811:android:dummy', 'android_client_info': {'package_name': 'com.autamedica.android'}}, 'oauth_client': [], 'api_key': [{'current_key': 'dummy'}], 'services': {}}],
                  'configuration_version': '1'
              }
              with open(path, 'w') as f:
                  json.dump(dummy, f, indent=2)
              print('⚠️ Created fallback dummy google-services.json for build')
          "

      - name: Run Unit Tests
        run: |
          cd apps/android
          ./gradlew testDebugUnitTest -PfirebasePerformanceInstrumentationEnabled=false --stacktrace

      - name: Build Release Bundle (AAB)
        run: |
          cd apps/android
          ./gradlew bundleRelease --stacktrace --info

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autamedica-release-v${{ steps.version_info.outputs.version_name }}-code${{ steps.version_info.outputs.version_code }}
          path: apps/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Build signed Android APK for controlled device tests
        run: |
          cd apps/android
          ./gradlew assembleRelease -PfirebasePerformanceInstrumentationEnabled=false --stacktrace

      - name: Verify release APK signing, package identity and SHA256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(apps/android/app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          verifier="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$verifier"
          "$verifier" verify --verbose "$apk"
          # Enforce release signature, exact application id and versionCode.
          inspector="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$inspector"
          info="$("$inspector" dump badging "$apk" | head -n 1)"
          [[ "$info" == *"name='com.autamedica.android'"* ]]
          [[ "$info" == *"versionCode='${{ steps.version_info.outputs.version_code }}'"* ]]
          sha256sum "$apk"
          echo "APK_SIGNED_AND_PACKAGE_VERIFIED=true" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 recorded in action logs; no keystore or clinical data exposed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK for private device verification
        uses: actions/upload-artifact@v4
        with:
          name: autamedica-android-clinical-v${{ steps.version_info.outputs.version_name }}-code${{ steps.version_info.outputs.version_code }}-signed-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed APK and AAB to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version_info.outputs.version_name }}
          name: AutaMedica Android v${{ steps.version_info.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/release/*.apk

      - name: Build Summary
        run: |
          echo "## 📱 AutaMedica Android Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name:** \`${{ steps.version_info.outputs.version_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code:** \`${{ steps.version_info.outputs.version_code }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Format:** Android App Bundle (AAB)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`autamedica-release-v${{ steps.version_info.outputs.version_name }}-code${{ steps.version_info.outputs.version_code }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Compilación y firma de release exitosas" >> $GITHUB_STEP_SUMMARY

  upload-play-store:
    timeout-minutes: 15
    name: Deploy to Google Play Console
    runs-on: ubuntu-latest
    needs: build-release-aab
    if: |
      always() &&
      needs.build-release-aab.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_play_store == 'true'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: autamedica-release-v${{ needs.build-release-aab.outputs.version_name }}-code${{ needs.build-release-aab.outputs.version_code }}
          path: ./aab

      - name: Check for Google Play Service Account Secret
        id: check_sa
        env:
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
            echo "✅ Google Play Service Account secret found"
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "⚠️ GOOGLE_PLAY_SERVICE_ACCOUNT secret not configured in repo"
          fi

      - name: "Pre-flight: validate versionCode against Play"
        if: steps.check_sa.outputs.has_secret == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet google-auth
          python3 - <<'PY'
          import json, os
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account

          BUILD_VERSION_CODE = int("${{ needs.build-release-aab.outputs.version_code }}")
          PKG = "com.autamedica.android"

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SERVICE_ACCOUNT"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          session = AuthorizedSession(creds)

          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PKG}"

          resp = session.post(f"{base}/edits")
          resp.raise_for_status()
          edit_id = resp.json()["id"]
          print(f"Edit created: {edit_id}")

          max_code = 0
          try:
              for track in ("internal", "alpha", "beta", "production"):
                  res = session.get(f"{base}/edits/{edit_id}/tracks/{track}")
                  if res.status_code == 404:
                      print(f"Track '{track}': empty or not configured, skipping")
                      continue
                  res.raise_for_status()
                  releases = res.json().get("releases", [])
                  codes = []
                  for release in releases:
                      codes.extend(int(vc) for vc in release.get("versionCodes", []))
                  max_code = max(max_code, *codes) if codes else max_code
                  print(f"Track '{track}': versionCodes={sorted(codes)}")
          finally:
              session.delete(f"{base}/edits/{edit_id}")

          print(f"Build versionCode: {BUILD_VERSION_CODE}")
          print(f"Max Play versionCode across all tracks: {max_code}")

          if BUILD_VERSION_CODE <= max_code:
              raise SystemExit(
                  f"BLOCKED: versionCode {BUILD_VERSION_CODE} <= max deployed {max_code}. "
                  "Bump versionCode in build.gradle.kts before pushing."
              )
          print(f"✅ versionCode {BUILD_VERSION_CODE} is safe to deploy")
          PY

      - name: Upload to Google Play selected track
        id: play_production
        if: steps.check_sa.outputs.has_secret == 'true'
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.autamedica.android
          releaseFiles: ./aab/*.aab
          tracks: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track || 'production' }}
          status: completed

      - name: Fallback to Google Play internal track
        id: play_internal_fallback
        if: steps.check_sa.outputs.has_secret == 'true' && steps.play_production.outcome == 'failure' && (github.event_name == 'push' || github.event.inputs.track == 'production')
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.autamedica.android
          releaseFiles: ./aab/*.aab
          tracks: internal
          status: completed

      - name: Deploy Summary
        run: |
          echo "## 🚀 Google Play Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_sa.outputs.has_secret }}" = "true" ]; then
            echo "- **Estado:** ✅ Subido con éxito a Google Play Console" >> $GITHUB_STEP_SUMMARY
            echo "- **Pista (Track):** \`${{ steps.play_internal_fallback.outcome == 'success' && 'internal (fallback)' || github.event.inputs.track || 'production' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Paquete:** \`com.autamedica.android\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Estado:** ⚠️ AAB compilado y firmado, pero falta configurar el secreto \`GOOGLE_PLAY_SERVICE_ACCOUNT\` para la subida desatendida a Play Store." >> $GITHUB_STEP_SUMMARY
            echo "- **Acción manual:** El artefacto AAB firmado está listo en la pestaña Artifacts de GitHub Actions para descarga y carga manual en Play Console, o podés agregar el secreto \`GOOGLE_PLAY_SERVICE_ACCOUNT\` para que suba automáticamente." >> $GITHUB_STEP_SUMMARY
          fi
