name: Apply Single Supabase Migration

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: "Committed migration path (supabase/migrations/YYYYMMDDHHMMSS_name.sql)"
        required: true
        default: "supabase/migrations/20261122231500_fix_eventual_patient_cpf_checksum_weights.sql"
        type: string

permissions:
  contents: read

jobs:
  apply-migration:
    name: Apply committed migration to Supabase Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Apply committed SQL migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'qxjjrpksmwwrmubhvjew' }}
          MIGRATION_FILE: ${{ inputs.migration_file }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          if [[ ! "${MIGRATION_FILE}" =~ ^supabase/migrations/([0-9]{14})_([a-z0-9_]+)\.sql$ ]]; then
            echo "::error::Invalid migration_file path: ${MIGRATION_FILE}"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          NAME="${BASH_REMATCH[2]}"
          test -f "${MIGRATION_FILE}" || { echo "::error::Migration file not found: ${MIGRATION_FILE}"; exit 1; }

          python3 - "${MIGRATION_FILE}" "${VERSION}" "${NAME}" <<'PY'
          import json, os, sys, urllib.request, urllib.error

          path, version, name = sys.argv[1], sys.argv[2], sys.argv[3]
          project_id = os.environ["SUPABASE_PROJECT_ID"]
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          sql = open(path, "r", encoding="utf-8").read()

          def run_sql(query: str):
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{project_id}/database/query",
                  data=json.dumps({"query": query}).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "Autamedica-Migration-Apply/1.0",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, resp.read().decode("utf-8")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  print(f"::error::Supabase query failed HTTP {e.code}: {body[:500]}")
                  sys.exit(1)

          status, _ = run_sql(sql)
          print(f"Applied {path} (HTTP {status})")

          ledger_sql = (
              "INSERT INTO supabase_migrations.schema_migrations (version, name) "
              f"VALUES ('{version}', '{name}') ON CONFLICT (version) DO NOTHING;"
          )
          l_status, _ = run_sql(ledger_sql)
          print(f"Recorded schema_migrations version {version} (HTTP {l_status})")

          verify_sql = (
              "SELECT strpos(pg_get_functiondef("
              "'public.create_doctor_eventual_patient(uuid,text,text,text,text,date,text,text,text,text)'::regprocedure"
              "), 'v_len + 2 - v_idx') > 0 AS cpf_weights_fixed;"
          )
          v_status, v_body = run_sql(verify_sql)
          print(f"Verification (HTTP {v_status}): {v_body}")
          PY
