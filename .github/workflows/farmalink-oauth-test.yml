name: Farmalink TEST OAuth and demo altaReceta (no production)

on:
  push:
    branches:
      - test/farmalink-oauth-smoke-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-oauth:
    name: Farmalink TEST login and one official DEMO altaReceta
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout v4.3.1
        with:
          persist-credentials: false
      - name: Check OAuth token (never print credentials or token)
        env:
          FARMALINK_TEST_OAUTH_PASSWORD: ${{ secrets.FARMALINK_TEST_OAUTH_PASSWORD }}
          FARMALINK_TEST_BASIC_PASSWORD: ${{ secrets.FARMALINK_TEST_BASIC_PASSWORD }}
        run: python3 scripts/farmalink/oauth_smoke.py
      - name: Send one official DEMO altaReceta to Farmalink TEST only
        env:
          FARMALINK_TEST_OAUTH_PASSWORD: ${{ secrets.FARMALINK_TEST_OAUTH_PASSWORD }}
          FARMALINK_TEST_BASIC_PASSWORD: ${{ secrets.FARMALINK_TEST_BASIC_PASSWORD }}
        run: python3 scripts/farmalink/alta_demo_smoke.py
