name: Farmalink TEST negative contract smoke (no valid prescriptions)

on:
  push:
    branches:
      - test/farmalink-oauth-smoke-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-rejections:
    name: Check safe alta consulta baja format rejections in TEST
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Run three non-mutating POST requests with incomplete fields
        env:
          FARMALINK_TEST_OAUTH_PASSWORD: ${{ secrets.FARMALINK_TEST_OAUTH_PASSWORD }}
          FARMALINK_TEST_BASIC_PASSWORD: ${{ secrets.FARMALINK_TEST_BASIC_PASSWORD }}
        run: python3 scripts/farmalink/rejection_smoke.py
