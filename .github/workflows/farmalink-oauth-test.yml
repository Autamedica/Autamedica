name: Farmalink TEST one-shot DEMO integration cycle

on:
  push:
    branches:
      - test/farmalink-oauth-smoke-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-shot-demo:
    name: One vendor DEMO alta, then conditional consulta and baja
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Execute single TEST DEMO cycle; no automatic retries
        env:
          FARMALINK_TEST_OAUTH_PASSWORD: ${{ secrets.FARMALINK_TEST_OAUTH_PASSWORD }}
          FARMALINK_TEST_BASIC_PASSWORD: ${{ secrets.FARMALINK_TEST_BASIC_PASSWORD }}
        run: python3 scripts/farmalink/sandbox_demo_cycle.py
