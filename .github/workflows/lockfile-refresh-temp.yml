name: Temporary pnpm lockfile refresh
on:
  push:
    branches:
      - security/clinical-approval-rls-20261111
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lockfile-refresh-temp.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: '9.15.2'
      - name: Regenerate lockfile from current workspace manifests
        run: pnpm install --no-frozen-lockfile
      - name: Commit the generated lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then echo 'Lockfile already current'; exit 0; fi
          git commit -m 'chore(deps): refresh pnpm lockfile against current manifests'
          git push origin HEAD:${GITHUB_REF_NAME}
