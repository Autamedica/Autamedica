name: OpenClaw Migration Preflight (read only)

on:
  push:
    branches: [feat/openclaw-chatgpt-mcp-relay-20261031]
    paths: ['.github/workflows/openclaw-migration-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OCI_HOST: ${{ secrets.OCI_OPENCLAW_HOST }}
      OCI_USER: ${{ secrets.OCI_OPENCLAW_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_OPENCLAW_SSH_KEY }}
      OCI_HOST_KEY: ${{ secrets.OCI_OPENCLAW_HOST_KEY }}
    steps:
      - name: Validate credential presence and pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          for n in OCI_HOST OCI_USER OCI_SSH_KEY OCI_HOST_KEY; do
            [[ -n "${!n:-}" ]] || { echo "::error::Missing $n"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_openclaw
          printf '%s\n' "$OCI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oci_openclaw ~/.ssh/known_hosts

      - name: Verify owner, disk, packages and backup prerequisites (read only)
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/oci_openclaw "$OCI_USER@$OCI_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          owner="$(systemctl show openclaw-gateway.service -p User --value)"
          if [[ -z "$owner" ]]; then
            echo 'BLOCKER: service has no explicit User'; exit 1
          fi
          home="$(getent passwd "$owner" | cut -d: -f6)"
          [[ -n "$home" && -d "$home" ]] || { echo 'BLOCKER: invalid service home'; exit 1; }
          state="$home/.openclaw"
          if [[ ! -d "$state" ]]; then
            echo 'state_default=not_present'
            echo 'candidate_config_directories:'
            sudo -n find /home /opt /root -maxdepth 5 -type f -name openclaw.json -printf '%h\n' 2>/dev/null | sort -u || true
            echo 'service_environment_state_path:'
            p="$(systemctl show openclaw-gateway.service -p Environment --value | tr ' ' '\n' | grep '^OPENCLAW_STATE_DIR=' | head -1 | cut -d= -f2- || true)"
            if [[ -n "$p" ]]; then echo "$p"; else echo 'not_explicitly_set'; fi
            echo 'state_scan_only=complete_no_backup'
            exit 0
          fi
          printf 'service_user_configured=yes\n'
          printf 'service_home=%s\n' "$home"
          printf 'state_location=%s\n' "$state"
          printf 'state_total_mb='
          sudo -n du -sm "$state" | awk '{print $1}'
          printf 'state_sqlite_count='
          sudo -n find "$state" -type f -name '*.sqlite' | wc -l
          printf 'state_wal_count='
          sudo -n find "$state" -type f -name '*-wal' | wc -l
          printf 'state_backup_existing='
          if sudo -n test -d "$home/Backups/openclaw"; then echo yes; else echo no; fi
          echo 'storage_megabytes:'
          df -Pm "$state" /usr/local /tmp | awk 'NR==1{print;next}!seen[$1]++{print}'
          echo 'tools:'
          for app in tar gzip sha256sum rsync sqlite3 npm node; do
            if command -v "$app" >/dev/null 2>&1; then printf '%s=present\n' "$app"; else printf '%s=missing\n' "$app"; fi
          done
          printf 'cli_path='
          command -v openclaw
          printf 'cli_realpath='
          readlink -f "$(command -v openclaw)"
          printf 'npm_root='
          npm root -g
          printf 'service_active='
          systemctl is-active openclaw-gateway.service || true
          pid="$(systemctl show openclaw-gateway.service -p MainPID --value)"
          if [[ "$pid" =~ ^[0-9]+$ && "$pid" -gt 0 ]]; then
            printf 'service_runtime='
            readlink -f "/proc/$pid/exe" || true
          fi
          printf 'service_owner_sudo_works='
          if sudo -n -u "$owner" -H true; then echo yes; else echo no; fi
          printf 'service_manager_sudo_works='
          if sudo -n systemctl show openclaw-gateway.service -p ActiveState --value >/dev/null; then echo yes; else echo no; fi
          REMOTE

      - name: Map active process to correct OpenClaw state (read only)
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/oci_openclaw "$OCI_USER@$OCI_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo 'service_user:'
          systemctl show openclaw-gateway.service -p User --value
          echo 'working_directory:'
          systemctl show openclaw-gateway.service -p WorkingDirectory --value
          pid="$(systemctl show openclaw-gateway.service -p MainPID --value)"
          if [[ "$pid" =~ ^[0-9]+$ && "$pid" -gt 0 ]]; then
            printf 'main_pid_runtime='
            sudo -n readlink -f "/proc/$pid/exe" || true
            printf 'main_pid_cwd='
            sudo -n readlink -f "/proc/$pid/cwd" || true
            echo 'select_process_environment_paths:'
            sudo -n cat "/proc/$pid/environ" | tr '\0' '\n' | grep -E '^(HOME|OPENCLAW_STATE_DIR|OPENCLAW_CONFIG_PATH|XDG_CONFIG_HOME)=' || true
          fi
          echo 'candidate_config_metadata:'
          while IFS= read -r p; do
            [[ -f "$p" ]] || continue
            sudo -n stat -c '%n owner=%U bytes=%s modified=%y' "$p"
            state="$(dirname "$p")"
            printf 'state_size_mib='
            sudo -n du -sm "$state" | cut -f1
            printf 'state_db_count='
            sudo -n find "$state" -maxdepth 5 -name '*.sqlite' -type f | wc -l
          done < <(sudo -n find /home /opt /root -maxdepth 5 -type f -name openclaw.json 2>/dev/null | sort -u)
          echo 'disk_free_mib:'
          df -Pm /opt /home /tmp | awk 'NR==1{print;next}!seen[$1]++{print}'
          echo 'tools_available:'
          for cmd in tar gzip sha256sum rsync sqlite3 npm node; do
            if command -v "$cmd" >/dev/null 2>&1; then echo "$cmd=yes"; else echo "$cmd=no"; fi
          done
          echo 'npm_root:'
          npm root -g
          echo 'cli_binary:'
          readlink -f "$(command -v openclaw)"
          REMOTE

      - name: Find disk pressure sources and confirm actual state symlinks (read only)
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/oci_openclaw "$OCI_USER@$OCI_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo 'storage_pressure:'
          df -h / && df -i /
          echo 'major_directories_mib:'
          sudo -n du -x -m --max-depth=1 /opt /var /home /root 2>/dev/null | sort -rn | head -30 || true
          echo 'known_safe_cache_sizes_mib:'
          for p in /var/cache /var/log/journal /root/.npm/_cacache /opt/nodejs/.npm/_cacache /home/ubuntu/.npm/_cacache /tmp; do
            if sudo -n test -d "$p"; then sudo -n du -sm "$p" 2>/dev/null; fi
          done
          echo 'system_journal:'
          sudo -n journalctl --disk-usage 2>/dev/null || true
          echo 'active_config_symlinks:'
          for p in /opt/openclaw/openclaw.json /opt/openclaw/.openclaw/openclaw.json; do
            if sudo -n test -e "$p"; then
              printf '%s realpath=' "$p"
              sudo -n readlink -f "$p"
              sudo -n stat -Lc 'size_bytes=%s owner=%U' "$p"
            else
              printf '%s not_present\n' "$p"
            fi
          done
          echo 'openclaw_state_directory:'
          sudo -n du -sm /opt/openclaw /opt/openclaw/.openclaw 2>/dev/null || true
          REMOTE
