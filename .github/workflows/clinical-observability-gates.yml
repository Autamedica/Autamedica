name: Clinical Observability Gates

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/ingest-patient-observation/**'
      - 'supabase/functions/_shared/auth-helpers.ts'
      - 'supabase/functions/deno.json'
      - 'apps/patients/src/hooks/useQuickActions.ts'
      - 'scripts/ci/verify-clinical-observability.mjs'
      - '.github/workflows/clinical-observability-gates.yml'
  push:
    branches: [main, staging, develop]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/ingest-patient-observation/**'
      - 'supabase/functions/_shared/auth-helpers.ts'
      - 'supabase/functions/deno.json'
      - 'apps/patients/src/hooks/useQuickActions.ts'
      - 'scripts/ci/verify-clinical-observability.mjs'
      - '.github/workflows/clinical-observability-gates.yml'

permissions:
  contents: read

jobs:
  coherence:
    name: Clinical Coherence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify clinical observability coherence
        run: node scripts/ci/verify-clinical-observability.mjs

  edge-function-static-check:
    name: Edge Function Static Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Lint edge function
        run: deno lint --config supabase/functions/deno.json supabase/functions/_shared/auth-helpers.ts supabase/functions/ingest-patient-observation/index.ts

      - name: Type check edge function
        run: deno check --no-lock --config supabase/functions/deno.json supabase/functions/ingest-patient-observation/index.ts
