name: Android Companion CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android-companion/**'
      - '.github/workflows/android-companion.yml'
  push:
    branches: [main, 'feat/android-companion-v1']
    paths:
      - 'apps/android-companion/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Build Autamedica Android Companion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        working-directory: apps/android-companion
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          test -s apps/android-companion/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apps/android-companion/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate MCP and Debian installer
        working-directory: apps/android-companion/tools/mcp
        run: |
          node --check mcp-server.mjs
          bash -n install-termux.sh
          npm install --omit=optional --no-audit --no-fund
          node --input-type=module -e "import('playwright-core').then(m => { if (!m.chromium?.connectOverCDP) process.exit(1); console.log('Playwright Core CDP client OK'); })"
      - uses: actions/upload-artifact@v4
        with:
          name: autamedica-android-companion-debug
          path: apps/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
