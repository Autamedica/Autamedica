name: Memed isolated sandbox demo probe
on:
  push:
    branches: [test/memed-demo-issue-20261105]
    paths:
      - 'scripts/memed-homologation-*.mjs'
      - '.github/workflows/memed-sandbox-demo-probe.yml'
  workflow_dispatch:
    inputs:
      emit_demo_once:
        description: "Opt in to one Memed sandbox DEMO issuance (fictional patient, no external delivery)"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  sdk-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: '9.15.2'
      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Audit Memed sandbox by default; issue only with explicit workflow_dispatch consent
        env:
          MEMED_DEMO_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.emit_demo_once == true && 'emit-once' || 'audit' }}
        run: node scripts/memed-homologation-browser.mjs
      - name: Upload masked sandbox UI screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memed-sandbox-ui-diagnostics
          path: test-results/memed-demo-identificacao.png
          retention-days: 1
          if-no-files-found: ignore

      - name: Preserve real Memed provider demo PDF, if independently verified
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memed-provider-authentic-demo-pdf
          path: test-results/memed-sandbox-provider-demo.pdf
          retention-days: 2
          if-no-files-found: ignore
