name: Runner Canary

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  canary:
    name: Environment
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - run: node --version && pnpm --version
      - run: deno --version 2>/dev/null || echo "deno not installed"
      - run: git --version

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages:core
      - run: pnpm typecheck
      - run: echo "Runner OK — $(hostname) — $(date -u)"
