name: OpenClaw Recovery Progress Probe

on:
  push:
    branches: [feat/openclaw-chatgpt-mcp-relay-20261031]
    paths: ['.github/workflows/openclaw-recovery-progress.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    env:
      OCI_HOST: ${{ secrets.OCI_OPENCLAW_HOST }}
      OCI_USER: ${{ secrets.OCI_OPENCLAW_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_OPENCLAW_SSH_KEY }}
      OCI_HOST_KEY: ${{ secrets.OCI_OPENCLAW_HOST_KEY }}
    steps:
      - name: Authenticate with pinned host key
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_HOST OCI_USER OCI_SSH_KEY OCI_HOST_KEY; do
            test -n "$(printenv "$name")" || { echo "missing=$name"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_openclaw
          printf '%s\n' "$OCI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oci_openclaw ~/.ssh/known_hosts
      - name: Check disk, progress and health (read only)
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oci_openclaw -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=12 "$OCI_USER@$OCI_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo 'disk_avail_mib='
          df -Pm / | tail -1 | awk '{print $4}'
          echo 'disk_inodes_avail='
          df -Pi / | tail -1 | awk '{print $4}'
          echo 'gateway_service='
          systemctl is-active openclaw-gateway.service || true
          echo 'gateway_ready_http='
          curl --silent --max-time 5 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:18789/readyz || true
          echo 'compression_process='
          if pgrep -x gzip >/dev/null; then echo running; else echo not_running; fi
          echo 'archive_status='
          for f in /var/log/messages-20260816 /var/log/messages-20260823 /var/log/messages-20260830 /var/log/messages-20260906; do
            if sudo -n test -f "$f.gz"; then
              printf '%s compressed_size_mib=' "$f"
              sudo -n du -m "$f.gz" | awk '{print $1}'
            elif sudo -n test -f "$f"; then
              echo "$f original_present"
            else
              echo "$f missing"
            fi
          done
          echo 'current_messages_mib='
          sudo -n du -m /var/log/messages 2>/dev/null | awk '{print $1}' || true
          REMOTE
