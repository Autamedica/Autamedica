name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: "Edge Function directory name under supabase/functions/ (or 'all')"
        required: true
        default: "memed-mobile-preflight"
        type: string
      sync_memed_mobile_secrets:
        description: "Also ensure MEMED_MOBILE_ENABLED=true and clear MEMED_MOBILE_PILOT_DOCTOR_ID"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-deploy-functions
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Deploy Edge Function(s) to Supabase Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: latest

      - name: Deploy Edge Function(s)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'qxjjrpksmwwrmubhvjew' }}
          FUNCTION_NAME: ${{ inputs.function_name }}
          SYNC_MEMED_SECRETS: ${{ inputs.sync_memed_mobile_secrets }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          test -n "${SUPABASE_PROJECT_ID}" || { echo "::error::SUPABASE_PROJECT_ID missing"; exit 1; }

          if [[ "${FUNCTION_NAME}" == "all" ]]; then
            for fn_dir in supabase/functions/*; do
              [[ ! -f "$fn_dir/index.ts" ]] && continue
              fn=$(basename "$fn_dir")
              echo "Deploying Edge Function: $fn"
              supabase functions deploy "$fn" --project-ref "${SUPABASE_PROJECT_ID}"
            done
          else
            if [[ ! "${FUNCTION_NAME}" =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::Invalid function_name: ${FUNCTION_NAME}"
              exit 1
            fi
            if [[ ! -f "supabase/functions/${FUNCTION_NAME}/index.ts" ]]; then
              echo "::error::Edge Function entrypoint not found: supabase/functions/${FUNCTION_NAME}/index.ts"
              exit 1
            fi
            echo "Deploying Edge Function: ${FUNCTION_NAME}"
            supabase functions deploy "${FUNCTION_NAME}" --project-ref "${SUPABASE_PROJECT_ID}"
          fi

          if [[ "${SYNC_MEMED_SECRETS}" == "true" ]]; then
            test "${SUPABASE_PROJECT_ID}" = "qxjjrpksmwwrmubhvjew"
            supabase secrets set --yes --project-ref "${SUPABASE_PROJECT_ID}" MEMED_MOBILE_ENABLED=true
            supabase secrets unset --yes --project-ref "${SUPABASE_PROJECT_ID}" MEMED_MOBILE_PILOT_DOCTOR_ID || true
            echo "Memed mobile Edge Function secrets synchronized."
          fi
