name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_database:
        description: "Deploy Supabase migrations and edge functions"
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.2"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_API: ${{ vars.TURBO_API }}

jobs:
  validate:
    name: Pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm typecheck

  deploy-db:
    name: DB Migrations
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_database
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-core: "false"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: latest

      - name: Validate Supabase deploy configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          missing=0
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Push migrations and deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push --include-all
          for fn_dir in supabase/functions/*; do
            [[ ! -f "$fn_dir/index.ts" ]] && continue
            fn=$(basename "$fn_dir")
            supabase functions deploy "$fn"
          done

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 20
    if: always() && needs.validate.result == 'success'
    outputs:
      prev_deployment: ${{ steps.snapshot.outputs.id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-turbo: "true"
      - name: Validate deploy configuration
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SIGNALING_URL: ${{ secrets.PUBLIC_SIGNALING_URL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUS_INTEROP_NON_FHIR_APPLICATION_NAME: ${{ secrets.BUS_INTEROP_NON_FHIR_APPLICATION_NAME }}
          BUS_INTEROP_NON_FHIR_PASSWORD: ${{ secrets.BUS_INTEROP_NON_FHIR_PASSWORD }}
          BUS_INTEROP_NON_FHIR_DOMAIN_CODE: ${{ secrets.BUS_INTEROP_NON_FHIR_DOMAIN_CODE }}
          RENAPDIS_RL_NUMBER: ${{ secrets.RENAPDIS_RL_NUMBER || 'RL-2026-47574120-APN-SSVEIYES#MS' }}
        run: |
          missing=0
          for key in \
            PUBLIC_SUPABASE_URL \
            PUBLIC_SUPABASE_ANON_KEY \
            PUBLIC_SIGNALING_URL \
            PUBLIC_APP_URL \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            BUS_INTEROP_NON_FHIR_APPLICATION_NAME \
            BUS_INTEROP_NON_FHIR_PASSWORD \
            BUS_INTEROP_NON_FHIR_DOMAIN_CODE \
            RENAPDIS_RL_NUMBER
          do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required secret or env: $key"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
      - name: Build workspace packages
        run: pnpm build:packages:core

      - name: Build web
        run: pnpm --filter @autamedica/web build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SIGNALING_URL: ${{ secrets.PUBLIC_SIGNALING_URL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          PUBLIC_PATIENTS_URL: https://paciente.autamedica.com
          PUBLIC_DOCTORS_URL: https://doctor.autamedica.com
          PUBLIC_COMPANIES_URL: https://empresa.autamedica.com
          PUBLIC_ADMIN_URL: https://autamedica-admin.pages.dev
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
          CLOUDFLARE_CALLS_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_CALLS_TURN_KEY_ID }}
          CLOUDFLARE_CALLS_TURN_TOKEN: ${{ secrets.CLOUDFLARE_CALLS_TURN_TOKEN }}
          BUS_INTEROP_NON_FHIR_APPLICATION_NAME: ${{ secrets.BUS_INTEROP_NON_FHIR_APPLICATION_NAME }}
          BUS_INTEROP_NON_FHIR_PASSWORD: ${{ secrets.BUS_INTEROP_NON_FHIR_PASSWORD }}
          BUS_INTEROP_NON_FHIR_DOMAIN_CODE: ${{ secrets.BUS_INTEROP_NON_FHIR_DOMAIN_CODE }}
          RENAPDIS_RL_NUMBER: ${{ secrets.RENAPDIS_RL_NUMBER || 'RL-2026-47574120-APN-SSVEIYES#MS' }}

      - name: Sync Cloudflare Pages runtime secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUS_INTEROP_NON_FHIR_APPLICATION_NAME: ${{ secrets.BUS_INTEROP_NON_FHIR_APPLICATION_NAME }}
          BUS_INTEROP_NON_FHIR_PASSWORD: ${{ secrets.BUS_INTEROP_NON_FHIR_PASSWORD }}
          BUS_INTEROP_NON_FHIR_DOMAIN_CODE: ${{ secrets.BUS_INTEROP_NON_FHIR_DOMAIN_CODE }}
        run: |
          projects=(
            autamedica-web
            autamedica-doctors
            autamedica-patients
            autamedica-companies
            autamedica-admin
          )

          for project in "${projects[@]}"; do
            printf '%s' "$BUS_INTEROP_NON_FHIR_APPLICATION_NAME" | pnpm dlx wrangler pages secret put BUS_INTEROP_NON_FHIR_APPLICATION_NAME --project-name="$project"
            printf '%s' "$BUS_INTEROP_NON_FHIR_PASSWORD" | pnpm dlx wrangler pages secret put BUS_INTEROP_NON_FHIR_PASSWORD --project-name="$project"
            printf '%s' "$BUS_INTEROP_NON_FHIR_DOMAIN_CODE" | pnpm dlx wrangler pages secret put BUS_INTEROP_NON_FHIR_DOMAIN_CODE --project-name="$project"
          done

      - name: Snapshot current deployment
        id: snapshot
        run: |
          ID=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/autamedica-web/deployments?env=production&per_page=1" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -r '.result[0].id // empty') || true
          echo "id=${ID}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Deploy (www)
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: pages deploy dist --project-name=autamedica-web --branch=main

      - name: Deploy (subdomains)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for project in autamedica-doctors autamedica-patients autamedica-companies autamedica-admin; do
            pnpm dlx wrangler pages deploy dist --project-name="$project" --branch=main
          done

      - name: Create Sentry Release
        if: success()
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: autamedica
          SENTRY_PROJECT: javascript-astro
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "Sentry token not found, skipping release... (Not an error)"
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          VERSION=$(sentry-cli releases propose-version)
          echo "Finalizing Sentry release: $VERSION"
          sentry-cli releases new "$VERSION"
          sentry-cli releases set-commits "$VERSION" --auto
          sentry-cli releases finalize "$VERSION"

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    timeout-minutes: 5
    steps:
      - name: CDN propagation
        run: sleep 15

      - name: Homepage
        run: |
          for i in $(seq 1 10); do
            status=$(curl -so /dev/null -w '%{http_code}' -L https://www.autamedica.com)
            [[ "$status" == "200" ]] && echo "OK" && exit 0
            sleep 5
          done
          exit 1

      - name: Asset integrity
        run: |
          status=$(curl -so /dev/null -w '%{http_code}' "https://www.autamedica.com/nonexistent-$(date +%s).js")
          if [[ "$status" == "200" ]]; then
            echo "::error::Missing .js returned 200 — MIME type errors in production"
            exit 1
          fi

      - name: API health
        run: |
          status=$(curl -so /dev/null -w '%{http_code}' -L "${{ secrets.PUBLIC_SUPABASE_URL }}/rest/v1/")
          echo "Supabase: $status"
          [[ "$status" == "200" || "$status" == "401" ]]

      - name: Role surfaces
        run: |
          for url in \
            https://www.autamedica.com \
            https://paciente.autamedica.com \
            https://doctor.autamedica.com \
            https://empresa.autamedica.com
          do
            status=$(curl -so /dev/null -w '%{http_code}' -L "$url")
            echo "$url: $status"
            [[ "$status" == "200" || "$status" == "302" ]]
          done

  auto-rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [build-and-deploy, smoke-tests]
    if: failure() && needs.build-and-deploy.result == 'success' && needs.build-and-deploy.outputs.prev_deployment != ''
    steps:
      - name: Rollback to previous deployment
        run: |
          PREV="${{ needs.build-and-deploy.outputs.prev_deployment }}"
          echo "Rolling back to $PREV"
          RESULT=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/autamedica-web/deployments/${PREV}/rollback" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          echo "$RESULT" | jq -r '.success' | grep -q true

  summary:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [validate, deploy-db, build-and-deploy, smoke-tests, auto-rollback]
    if: always()
    steps:
      - run: |
          echo "## Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          # CI gate removed
          echo "| Pre-flight | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DB | ${{ needs.deploy-db.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Deploy | ${{ needs.build-and-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback | ${{ needs.auto-rollback.result }} |" >> $GITHUB_STEP_SUMMARY
