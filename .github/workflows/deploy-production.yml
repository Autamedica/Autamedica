name: Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'worker/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      deploy_database:
        description: "Deploy Supabase migrations and edge functions"
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.2"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_API: ${{ vars.TURBO_API }}

jobs:
  validate:
    name: Pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm hardcode:check

  deploy-db:
    name: DB Migrations
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_database
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-core: "false"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: latest

      - name: Validate Supabase deploy configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          missing=0
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Push migrations and deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push --include-all
          for fn_dir in supabase/functions/*; do
            [[ ! -f "$fn_dir/index.ts" ]] && continue
            fn=$(basename "$fn_dir")
            supabase functions deploy "$fn"
          done

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [validate, deploy-db]
    timeout-minutes: 20
    if: always() && !cancelled() && needs.validate.result == 'success' && (needs.deploy-db.result == 'success' || needs.deploy-db.result == 'skipped')
    outputs:
      prev_deployments: ${{ steps.snapshot.outputs.deployments }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-turbo: "true"
      - name: Validate deploy configuration
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SIGNALING_URL: ${{ secrets.PUBLIC_SIGNALING_URL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENAPDIS_RL_NUMBER: ${{ secrets.RENAPDIS_RL_NUMBER || 'RL-2026-47574120-APN-SSVEIYES#MS' }}
        run: |
          missing=0
          for key in \
            PUBLIC_SUPABASE_URL \
            PUBLIC_SUPABASE_ANON_KEY \
            PUBLIC_SIGNALING_URL \
            PUBLIC_APP_URL \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            RENAPDIS_RL_NUMBER
          do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required secret or env: $key"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
      - name: Configure Memed credentials for the doctor portal
        env:
          MEMED_API_KEY: ${{ secrets.MEMED_API_KEY }}
          MEMED_SECRET_KEY: ${{ secrets.MEMED_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Memed is optional; provider credential rejection must not block unrelated production releases.
        continue-on-error: true
        run: node scripts/ops/sync-memed-secrets.mjs
      - name: Build workspace packages
        run: pnpm build:packages:core

      - name: Build web
        run: pnpm --filter @autamedica/web build
        env:
          # Public GA4 web stream ID; required at Astro compile time.
          PUBLIC_GA4_MEASUREMENT_ID: G-YRN6QY3BTY
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: autamedica
          SENTRY_PROJECT: javascript-astro
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SIGNALING_URL: ${{ secrets.PUBLIC_SIGNALING_URL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          PUBLIC_PATIENTS_URL: https://paciente.autamedica.com
          PUBLIC_DOCTORS_URL: https://doctor.autamedica.com
          PUBLIC_COMPANIES_URL: https://empresa.autamedica.com
          PUBLIC_ADMIN_URL: https://autamedica-admin.pages.dev
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
          CLOUDFLARE_CALLS_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_CALLS_TURN_KEY_ID }}
          CLOUDFLARE_CALLS_TURN_TOKEN: ${{ secrets.CLOUDFLARE_CALLS_TURN_TOKEN }}
          RENAPDIS_RL_NUMBER: ${{ secrets.RENAPDIS_RL_NUMBER || 'RL-2026-47574120-APN-SSVEIYES#MS' }}

      - name: Unit tests before deployment
        run: pnpm test:unit

      - name: Snapshot production deployments
        id: snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          snapshots='{}'
          for project in autamedica-web autamedica-doctors autamedica-patients autamedica-companies autamedica-admin; do
            response=$(curl --fail --silent --show-error --max-time 30 \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            id=$(jq -er 'select(.success == true) | .result.canonical_deployment.id | select(type == "string" and length > 0)' <<< "$response")
            snapshots=$(jq -c --arg project "$project" --arg id "$id" '. + {($project): $id}' <<< "$snapshots")
          done
          echo "deployments=$snapshots" >> "$GITHUB_OUTPUT"

      - name: Deploy (www)
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: pages deploy dist --project-name=autamedica-web --branch=main

      - name: Deploy (subdomains)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for project in autamedica-doctors autamedica-patients autamedica-companies autamedica-admin; do
            pnpm dlx wrangler pages deploy dist --project-name="$project" --branch=main
          done

      - name: Create Sentry Release
        if: success()
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: autamedica
          SENTRY_PROJECT: javascript-astro
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "Sentry token not found, skipping release... (Not an error)"
            exit 0
          fi
          # Sentry metadata is best-effort: never fail the deploy or trigger Pages rollback.
          set +e
          curl -sL https://sentry.io/get-cli/ | bash
          if [[ "$?" -ne 0 ]]; then
            echo "::warning::Could not install sentry-cli; continuing with deployed sites."
            exit 0
          fi
          VERSION=$(sentry-cli releases propose-version)
          if [[ -z "$VERSION" ]]; then
            echo "::warning::Could not determine Sentry release version; continuing."
            exit 0
          fi
          echo "Finalizing Sentry release: $VERSION"
          sentry-cli releases new "$VERSION" || echo "::notice::Sentry release already exists or could not be created."
          sentry-cli releases set-commits "$VERSION" --auto --ignore-missing || echo "::warning::Sentry commit association failed; continuing."
          sentry-cli releases finalize "$VERSION" || echo "::warning::Sentry release finalization failed; continuing."
          exit 0

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    # Run smoke even when the optional DB job was skipped upstream.
    if: always() && needs.build-and-deploy.result == 'success'
    timeout-minutes: 5
    steps:
      - name: CDN propagation
        run: sleep 15

      - name: Homepage
        run: |
          for i in $(seq 1 10); do
            status=$(curl -so /dev/null -w '%{http_code}' -L https://www.autamedica.com)
            [[ "$status" == "200" ]] && echo "OK" && exit 0
            sleep 5
          done
          exit 1

      - name: Asset integrity
        run: |
          status=$(curl -so /dev/null -w '%{http_code}' "https://www.autamedica.com/nonexistent-$(date +%s).js")
          if [[ "$status" != "404" ]]; then
            echo "::error::Missing .js must return 404; got $status"
            exit 1
          fi

      - name: API health
        run: |
          status=$(curl -so /dev/null -w '%{http_code}' -L "${{ secrets.PUBLIC_SUPABASE_URL }}/rest/v1/")
          echo "Supabase: $status"
          [[ "$status" == "200" || "$status" == "401" ]]

      - name: License verification transport
        run: |
          for origin in https://www.autamedica.com https://autamedica-admin-5r9.pages.dev; do
            status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}'  -X POST -H 'Content-Type: application/json'  --data '{"doctorId":"00000000-0000-0000-0000-000000000000","persist":false}'  "$origin/api/admin/doctors/license-verify-live")
            echo "$origin license verification: $status"
            if [[ "$status" != "401" ]]; then
              echo "::error::Unauthenticated license verification must return 401, got $status"
              exit 1
            fi
          done

      - name: Role surfaces
        run: |
          for url in \
            https://www.autamedica.com \
            https://paciente.autamedica.com \
            https://doctor.autamedica.com \
            https://empresa.autamedica.com \
            https://autamedica-admin.pages.dev
          do
            status=$(curl -so /dev/null -w '%{http_code}' -L "$url")
            echo "$url: $status"
            [[ "$status" == "200" || "$status" == "302" ]]
          done

  auto-rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [build-and-deploy, smoke-tests]
    if: always() && (needs.build-and-deploy.result == 'failure' || needs.smoke-tests.result == 'failure') && needs.build-and-deploy.outputs.prev_deployments != ''
    timeout-minutes: 10
    steps:
      - name: Restore all changed production projects
        env:
          PREVIOUS_DEPLOYMENTS: ${{ needs.build-and-deploy.outputs.prev_deployments }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          failed=0
          for project in autamedica-web autamedica-doctors autamedica-patients autamedica-companies autamedica-admin; do
            previous=$(jq -er --arg project "$project" '.[$project] | select(type == "string" and length > 0)' <<< "$PREVIOUS_DEPLOYMENTS") || { failed=1; continue; }
            endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project"
            current=$(curl --fail --silent --show-error --max-time 30 "$endpoint" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -er 'select(.success == true) | .result.canonical_deployment.id') || { failed=1; continue; }
            if [[ "$current" == "$previous" ]]; then
              echo "$project unchanged"
              continue
            fi
            response=$(curl --fail --silent --show-error --max-time 30 -X POST \
              "$endpoint/deployments/$previous/rollback" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN") || { failed=1; continue; }
            jq -e '.success == true' <<< "$response" > /dev/null || { failed=1; continue; }
            echo "$project restored"
          done
          exit "$failed"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [validate, deploy-db, build-and-deploy, smoke-tests, auto-rollback]
    if: always()
    steps:
      - run: |
          echo "## Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          # Pre-flight lint/typechecks and unit tests run before deployment.
          echo "| Pre-flight | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DB | ${{ needs.deploy-db.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Deploy | ${{ needs.build-and-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback | ${{ needs.auto-rollback.result }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.validate.result }}" != "success" || "${{ needs.build-and-deploy.result }}" != "success" || "${{ needs.smoke-tests.result }}" != "success" ]]; then
            echo "::error::Production deployment verification failed (pre-flight, build or smoke)."
            exit 1
          fi

