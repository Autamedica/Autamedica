name: Rotate Jordan SFU HMAC secrets

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROTATE to replace the shared production signing key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-sfu-hmac-secret-rotation
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate and verify production secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qxjjrpksmwwrmubhvjew
    steps:
      - name: Rotate, read back and exercise cloudflare-calls
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          set +x
          [[ "$CONFIRMATION" == "ROTATE" ]] || { echo "::error::Confirmation mismatch"; exit 1; }
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing required secret: $name"; exit 1; }
          done

          secret="$(openssl rand -hex 32)"
          [[ "$secret" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "::add-mask::$secret"

          tmpdir="$(mktemp -d)"
          chmod 700 "$tmpdir"
          trap 'rm -rf "$tmpdir"' EXIT

          jq -n --arg value "$secret" \
            '{deployment_configs:{production:{env_vars:{GUEST_TOKEN_SECRET:{type:"secret_text",value:$value}}}}}' \
            > "$tmpdir/cloudflare-patch.json"

          for project in autamedica-web autamedica-doctors; do
            status="$(curl --silent --show-error --max-time 30 \
              --output "$tmpdir/cf-patch-$project.json" --write-out '%{http_code}' \
              --request PATCH \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$tmpdir/cloudflare-patch.json")"
            if [[ "$status" != "200" ]] || ! jq -e '.success == true' "$tmpdir/cf-patch-$project.json" >/dev/null; then
              echo "::error::Cloudflare secret update failed for $project (HTTP $status)"
              exit 1
            fi
          done

          jq -n --arg guest "$secret" \
            '[{name:"GUEST_TOKEN_SECRET",value:$guest},{name:"SFU_SESSION_BINDINGS_ENABLED",value:"true"}]' \
            > "$tmpdir/supabase-secrets.json"
          status="$(curl --silent --show-error --max-time 30 \
            --output "$tmpdir/supabase-post.json" --write-out '%{http_code}' \
            --request POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$tmpdir/supabase-secrets.json")"
          if [[ "$status" != "201" && "$status" != "200" ]]; then
            echo "::error::Supabase secret update failed (HTTP $status)"
            exit 1
          fi

          status="$(curl --silent --show-error --max-time 30 \
            --output "$tmpdir/supabase-read.json" --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          if [[ "$status" != "200" ]] || ! jq -e --arg guest "$secret" '
            ([.[] | select(.name == "GUEST_TOKEN_SECRET" and .value == $guest)] | length) == 1
            and ([.[] | select(.name == "SFU_SESSION_BINDINGS_ENABLED" and .value == "true")] | length) == 1
          ' "$tmpdir/supabase-read.json" >/dev/null; then
            echo "::error::Supabase secret read-back verification failed (HTTP $status)"
            exit 1
          fi

          GUEST_TOKEN_SECRET="$secret" node --input-type=module <<'NODE'
          import { createHmac, randomUUID } from 'node:crypto';

          const secret = process.env.GUEST_TOKEN_SECRET;
          const now = Math.floor(Date.now() / 1000);
          const header = Buffer.from(JSON.stringify({ alg: 'HS256', typ: 'JWT' })).toString('base64url');
          const payload = Buffer.from(JSON.stringify({
            callId: randomUUID(),
            roomId: `sfu-secret-rotation-probe-${randomUUID()}`,
            guestName: 'SFU secret rotation smoke test',
            role: 'guest',
            iat: now,
            exp: now + 600,
          })).toString('base64url');
          const signingInput = `${header}.${payload}`;
          const signature = createHmac('sha256', secret).update(signingInput).digest('base64url');
          const token = `${signingInput}.${signature}`;
          const roomId = JSON.parse(Buffer.from(payload, 'base64url').toString()).roomId;

          const response = await fetch(
            'https://qxjjrpksmwwrmubhvjew.supabase.co/functions/v1/cloudflare-calls',
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-guest-token': token },
              body: JSON.stringify({ roomId, method: 'POST', path: 'sessions/new', body: {} }),
            },
          );
          const body = await response.text();
          console.log(`E2E signed guest-token: HTTP ${response.status} body ${body}`);
          if (response.status !== 403 || body.trim() !== '{"error":"guest_call_mismatch"}') {
            throw new Error('cloudflare-calls did not accept the signed guest token and reach room authorization');
          }
          NODE

          for project in autamedica-web autamedica-doctors; do
            status="$(curl --silent --show-error --max-time 30 \
              --output "$tmpdir/cf-read-$project.json" --write-out '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            if [[ "$status" != "200" ]] || ! jq -e '
              .success == true and
              .result.deployment_configs.production.env_vars.GUEST_TOKEN_SECRET.type == "secret_text"
            ' "$tmpdir/cf-read-$project.json" >/dev/null; then
              echo "::error::Cloudflare secret presence verification failed for $project (HTTP $status)"
              exit 1
            fi
          done

          echo "PASS: shared HMAC key rotated in Cloudflare Web + Doctors and Supabase."
          echo "PASS: SFU_SESSION_BINDINGS_ENABLED=true verified in Supabase."
          echo "PASS: Supabase read-back matched the in-memory 32-byte key without printing it."
