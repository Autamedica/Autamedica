name: One-time Android 1.2.16 Internal Play Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-android-internal-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    # Explicit release commit; normal pushes and workflow file edits are inert.
    if: startsWith(github.event.head_commit.message, 'chore(release): trigger Android 1.2.16 internal upload')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release version
        uses: actions/checkout@v4
      - name: Validate intended Android release
        run: |
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*26' apps/android/app/build.gradle.kts
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"1[.]2[.]16"' apps/android/app/build.gradle.kts
      - name: Fail if required Play Store credentials are absent
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT" || -z "$KEYSTORE_BASE64" ]]; then
            echo '::error::Google Play service account or Android signing key is not configured.'
            exit 1
          fi
      - name: Dispatch existing signed Android release with explicit internal upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/android-release.yml/dispatches" \
            -f ref=main \
            -f 'inputs[track]=internal' \
            -f 'inputs[upload_to_play_store]=true'
          echo 'Requested existing android-release.yml with track=internal; actual publication must be confirmed in that run.'
