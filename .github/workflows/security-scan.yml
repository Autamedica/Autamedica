name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.actor == 'coderabbitai[bot]' || github.actor == 'circleci-app[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && 'ignored' || 'active' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  HUSKY: '0'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.2'

jobs:
  dependency-scope:
    if: ${{ github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && github.actor != 'dependabot[bot]' }}
    name: Dependency Scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect dependency changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'package.json' 'pnpm-lock.yaml' 'pnpm-workspace.yaml' '.npmrc' '.pnpmfile.cjs' 'pnpmfile.cjs' \
            'apps/**/package.json' 'packages/**/package.json' 'patches/**' | grep -q .; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifests, lockfiles or package patches changed; full audit remains scheduled and runs on main."
          fi

      - name: Test high/critical audit policy parser
        run: node --test scripts/ci/check-high-audit.test.mjs

  dependency-audit:
    needs: dependency-scope
    if: >-
      needs.dependency-scope.outputs.required == 'true' && github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-core: 'false'

      - name: Dependency audit
        continue-on-error: true
        shell: bash
        run: |
          audit_file="$RUNNER_TEMP/pnpm-audit.json"
          audit_exit=0
          pnpm audit --json > "$audit_file" || audit_exit=$?
          if [ ! -s "$audit_file" ]; then
            echo "::error::pnpm audit did not produce a JSON report (exit $audit_exit)"
            exit 1
          fi
          node scripts/ci/check-high-audit.mjs "$audit_file"

  secret-scan:
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@6c64db94d5b2e09d7e0948fb6bd3166cc6fffbc7 # v3.94.0
        with:
          extra_args: --only-verified

      - name: Medical patterns
        if: github.event_name == 'pull_request'
        run: |
          git diff --unified=0 ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- '*.ts' '*.tsx' '*.js' '*.json' '*.env*' \
            | grep -E '^\+' \
            | grep -vE '^\+\+\+' \
            | grep -iE '((^|[^[:alnum:]_])(cedula|ruc)([^[:alnum:]_]|$)|historia.?clinica|paciente.*id.*=.*[0-9]{6,}|service_role|supabase_db_password)' \
            | grep -v 'type\|interface\|import\|//\|\.env\.\*\|secrets\.\|\.pdf\|\.download\|filename\|process\.env\|import\.meta\.env' \
            && echo "::error::Sensitive medical/infra pattern in diff" && exit 1 \
            || true

  # dependency-review requires Dependency Graph (GitHub Advanced Security).
  # Disabled: repo alternates public/private, feature unavailable when private.
  # Covered by pnpm audit in dependency-audit job above.
