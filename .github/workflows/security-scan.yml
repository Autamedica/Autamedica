name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

env:
  HUSKY: '0'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.2'

jobs:
  dependency-audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Moderate
        run: pnpm audit --audit-level=moderate 2>&1 || echo "::warning::Moderate vulnerabilities found"

      - name: High/Critical
        run: pnpm audit --audit-level=high

  secret-scan:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@6c64db94d5b2e09d7e0948fb6bd3166cc6fffbc7 # v3.94.0
        with:
          extra_args: --only-verified

      - name: Medical patterns
        if: github.event_name == 'pull_request'
        run: |
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- '*.ts' '*.tsx' '*.js' '*.json' '*.env*' \
            | grep -iE '(cedula|ruc|historia.?clinica|paciente.*id.*=.*[0-9]{6,}|service_role|supabase_db_password)' \
            | grep -v 'type\|interface\|import\|//\|\.env\.\*\|secrets\.\|\.pdf\|\.download\|filename' \
            && echo "::error::Sensitive medical/infra pattern in diff" && exit 1 \
            || true

  # dependency-review requires Dependency Graph (GitHub Advanced Security).
  # Disabled: repo alternates public/private, feature unavailable when private.
  # Covered by pnpm audit in dependency-audit job above.
