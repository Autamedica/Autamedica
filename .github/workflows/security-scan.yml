name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

env:
  HUSKY: '0'

jobs:
  dependency-audit:
    name: Audit
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile

      - name: Moderate
        run: pnpm audit --audit-level=moderate 2>&1 || echo "::warning::Moderate vulnerabilities found"

      - name: High/Critical
        run: pnpm audit --audit-level=high

  secret-scan:
    name: Secrets
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Medical patterns
        if: github.event_name == 'pull_request'
        run: |
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- '*.ts' '*.tsx' '*.js' '*.json' '*.env*' \
            | grep -iE '(cedula|ruc|historia.?clinica|paciente.*id.*=.*[0-9]{6,}|service_role|supabase_db_password)' \
            | grep -v 'type\|interface\|import\|//\|\.env\.\*\|secrets\.' \
            && echo "::error::Sensitive medical/infra pattern in diff" && exit 1 \
            || true

  dependency-review:
    name: Dep Review
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
