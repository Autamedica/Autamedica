name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.actor == 'coderabbitai[bot]' || github.actor == 'circleci-app[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && 'ignored' || 'active' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.2'

jobs:
  dependency-audit:
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-core: 'false'

      - name: Moderate
        run: pnpm audit --audit-level=moderate 2>&1 || echo "::warning::Moderate vulnerabilities found"

      - name: High/Critical
        run: node scripts/ci/check-high-audit.mjs

  secret-scan:
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@6c64db94d5b2e09d7e0948fb6bd3166cc6fffbc7 # v3.94.0
        with:
          extra_args: --only-verified

      - name: Medical patterns
        if: github.event_name == 'pull_request'
        run: |
          git diff --unified=0 ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- '*.ts' '*.tsx' '*.js' '*.json' '*.env*' \
            | grep -E '^\+' \
            | grep -vE '^\+\+\+' \
            | grep -iE '((^|[^[:alnum:]_])(cedula|ruc)([^[:alnum:]_]|$)|historia.?clinica|paciente.*id.*=.*[0-9]{6,}|service_role|supabase_db_password)' \
            | grep -v 'type\|interface\|import\|//\|\.env\.\*\|secrets\.\|\.pdf\|\.download\|filename\|process\.env\|import\.meta\.env' \
            && echo "::error::Sensitive medical/infra pattern in diff" && exit 1 \
            || true

  # dependency-review requires Dependency Graph (GitHub Advanced Security).
  # Disabled: repo alternates public/private, feature unavailable when private.
  # Covered by pnpm audit in dependency-audit job above.
