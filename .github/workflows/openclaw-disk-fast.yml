name: OpenClaw Disk Fast Inspect

on:
  push:
    branches: [feat/openclaw-chatgpt-mcp-relay-20261031]
    paths: ['.github/workflows/openclaw-disk-fast.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OCI_HOST: ${{ secrets.OCI_OPENCLAW_HOST }}
      OCI_USER: ${{ secrets.OCI_OPENCLAW_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_OPENCLAW_SSH_KEY }}
      OCI_HOST_KEY: ${{ secrets.OCI_OPENCLAW_HOST_KEY }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_openclaw
          printf '%s\n' "$OCI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oci_openclaw ~/.ssh/known_hosts
      - name: Quick bounded disk and active OpenClaw inspection
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -i ~/.ssh/oci_openclaw "$OCI_USER@$OCI_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo 'filesystem:'
          df -h /
          echo 'journal_total:'
          sudo -n journalctl --disk-usage 2>&1 || true
          echo 'selected_dir_sizes_mib:'
          for p in /var/log /var/cache /var/lib/docker /root/.npm/_cacache /opt/openclaw /opt/nodejs/lib/node_modules /home /tmp; do
            if sudo -n test -d "$p"; then
              value="$(sudo -n timeout 8 du -sm "$p" 2>/dev/null | cut -f1 || true)"
              printf '%s=%s\n' "$p" "${value:-timeout}"
            fi
          done
          echo 'active_state_candidates:'
          for p in /opt/openclaw/openclaw.json /opt/openclaw/.openclaw/openclaw.json; do
            if sudo -n test -e "$p"; then
              printf '%s -> ' "$p"
              sudo -n readlink -f "$p"
            else
              printf '%s -> missing\n' "$p"
            fi
          done
          REMOTE
