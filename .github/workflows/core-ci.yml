name: Core CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.2'

jobs:
  build-gate:
    name: Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages:core

      - name: Build apps validation
        run: pnpm build:apps

      - name: Security audit
        run: pnpm audit --audit-level=moderate || true

  lint-gate:
    name: Lint and Typecheck Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm build:packages:core

      - name: Typecheck
        run: pnpm check:all

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  metrics-gate:
    name: Metrics and SEO Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SEO parity validation
        run: |
          node scripts/seo/validate-parity.mjs
          node scripts/seo/validate-social-assets.mjs

      - name: Build packages
        run: pnpm build:packages:core

      - name: Build web
        run: pnpm --filter @autamedica/web build

      - name: Setup Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse placeholder
        run: echo "Lighthouse runs against staging domains or local preview."

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build-gate, lint-gate, unit-tests, metrics-gate]
    if: always()
    steps:
      - name: Check required gates
        run: |
          echo "## CI Status Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ needs.build-gate.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint and Types: ${{ needs.lint-gate.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Metrics and SEO: ${{ needs.metrics-gate.result }}" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.build-gate.result }}" != "success" ]] || \
             [[ "${{ needs.lint-gate.result }}" != "success" ]] || \
             [[ "${{ needs.metrics-gate.result }}" != "success" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Required gates failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All required gates passed." >> "$GITHUB_STEP_SUMMARY"
