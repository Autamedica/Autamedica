name: Deploy Impostor SFU Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-impostor-sfu-secrets
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync Cloudflare Calls secrets to Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      OCI_HOST: ${{ secrets.OCI_OPENCLAW_HOST }}
      OCI_USER: ${{ secrets.OCI_OPENCLAW_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_OPENCLAW_SSH_KEY }}
      CF_CALLS_APP_ID: ${{ secrets.CLOUDFLARE_CALLS_APP_ID }}
      CF_CALLS_APP_SECRET: ${{ secrets.CLOUDFLARE_CALLS_APP_SECRET }}

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_HOST OCI_USER CF_CALLS_APP_ID CF_CALLS_APP_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
          if [[ -z "$OCI_SSH_KEY" ]]; then
            echo "Missing required secret: OCI_OPENCLAW_SSH_KEY" >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_openclaw
          chmod 600 ~/.ssh/oci_openclaw
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: Deploy secrets and restart game
        shell: bash
        run: |
          set -euo pipefail
          payload="$({
            printf 'CLOUDFLARE_CALLS_APP_ID=%s\n' "$CF_CALLS_APP_ID"
            printf 'CLOUDFLARE_CALLS_APP_SECRET=%s\n' "$CF_CALLS_APP_SECRET"
          } | base64 -w0)"

          printf '%s' "$payload" | ssh -i ~/.ssh/oci_openclaw "$OCI_USER@$OCI_HOST" '
            set -euo pipefail
            tmp=$(mktemp)
            trap '\''rm -f "$tmp"'\'' EXIT
            base64 -d > "$tmp"
            sudo install -d -m 700 /etc/autamedica
            sudo install -o root -g root -m 600 "$tmp" /etc/autamedica/impostor-cloudflare-calls.env
            sudo install -d -m 755 /etc/systemd/system/autamedica-impostor.service.d
            printf "%s\n" "[Service]" "EnvironmentFile=/etc/autamedica/impostor-cloudflare-calls.env" \
              | sudo tee /etc/systemd/system/autamedica-impostor.service.d/sfu.conf >/dev/null
            sudo chmod 644 /etc/systemd/system/autamedica-impostor.service.d/sfu.conf
            sudo systemctl daemon-reload
            sudo systemctl restart autamedica-impostor.service
          '

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oci_openclaw "$OCI_USER@$OCI_HOST" '
            set -euo pipefail
            test "$(sudo stat -c %a /etc/autamedica/impostor-cloudflare-calls.env)" = "600"
            test "$(sudo grep -Ec "^CLOUDFLARE_CALLS_APP_(ID|SECRET)=.+$" /etc/autamedica/impostor-cloudflare-calls.env)" = "2"
            test "$(systemctl is-active autamedica-impostor.service)" = "active"
            curl --fail --silent --show-error http://127.0.0.1:8083/state >/dev/null
          '
          curl --fail --silent --show-error https://openclaw-relay.autamedica.com/state >/dev/null
          echo "Oracle received the GitHub Cloudflare Calls secrets and the game is healthy."
