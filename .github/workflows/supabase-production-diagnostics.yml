name: Supabase production read-only diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-production-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: supabase-production-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only database diagnostics
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/supabase-cpu-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect connection, active work and query costs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          project = os.environ.get("SUPABASE_PROJECT_ID", "")
          if not token or not project:
              sys.exit("Required Supabase deployment credentials are not configured.")
          if project != "qxjjrpksmwwrmubhvjew":
              sys.exit("Unexpected project; refusing to query another database.")

          # No raw SQL, clinical data, query literals or credentials are emitted.
          queries = [
              ("blocking_and_maintenance", """
                  select a.pid,a.usename,a.backend_type,a.state,a.wait_event_type,a.wait_event,
                    pg_catalog.now()-a.query_start as duration,
                    pg_catalog.pg_blocking_pids(a.pid) as blocking_pids,
                    left(pg_catalog.regexp_replace(a.query, $rx$'([^']|'')*'$rx$, $v$'?'$v$, 'g'),500) as sanitized_query,
                    (select pg_catalog.jsonb_agg(pg_catalog.jsonb_build_object(
                      'relation',l.relation::regclass::text,'mode',l.mode,'granted',l.granted))
                      from pg_catalog.pg_locks l where l.pid=a.pid and l.relation is not null) as relation_locks
                  from pg_catalog.pg_stat_activity a
                  where a.pid<>pg_catalog.pg_backend_pid()
                    and (a.wait_event_type='Lock' or a.backend_type='autovacuum worker')
                  order by a.query_start limit 12
              """),
              ("vacuum_progress", """
                  select pid,relid::regclass::text as relation,phase,
                    heap_blks_total,heap_blks_scanned,heap_blks_vacuumed
                  from pg_catalog.pg_stat_progress_vacuum
              """),
              ("table_maintenance_estimates", """
                  select schemaname,relname,n_live_tup,n_dead_tup,last_autovacuum,
                    last_autoanalyze,autovacuum_count
                  from pg_catalog.pg_stat_all_tables
                  where schemaname in ('cron','public')
                  order by n_dead_tup desc limit 12
              """),
              ("top_statement_shapes", """
                  select queryid,calls,total_exec_time,mean_exec_time,
                    left(pg_catalog.regexp_replace(query, $rx$'([^']|'')*'$rx$, $v$'?'$v$, 'g'),600) as sanitized_shape
                  from extensions.pg_stat_statements
                  where queryid in (-6710255986563676955,2547027867440680558,-3517798004889726781,
                    -9220160802380311162,-8856799461280935852,-7726440967385220442,1376911848066968962)
                  order by total_exec_time desc limit 10
              """),
          ]

          failures = 0
          for name, query in queries:
              print("DIAGNOSTIC " + name, flush=True)
              request = urllib.request.Request(
                  "https://api.supabase.com/v1/projects/" + project + "/database/query/read-only",
                  data=json.dumps({"query": query}).encode(),
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=65) as response:
                      result = json.load(response)
                  print(json.dumps(result, ensure_ascii=True), flush=True)
              except urllib.error.HTTPError as error:
                  failures += 1
                  print("HTTP " + str(error.code) + ": " + error.read(4000).decode(errors="replace"), flush=True)
              except (urllib.error.URLError, TimeoutError, ValueError) as error:
                  failures += 1
                  print(type(error).__name__ + ": " + str(error), flush=True)
          if failures:
              sys.exit("One or more read-only diagnostics failed.")
