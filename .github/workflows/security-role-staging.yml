name: Role Security - Staging
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/role_authority_guard_smoke.sql'
      - 'supabase/tests/role_authority_ci_bootstrap.sql'
      - '.github/workflows/security-role-staging.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      isolated_only:
        description: 'Run the disposable PostgreSQL tests as a CI gate without staging credentials'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  role-guard-isolated:
    name: Role authority (disposable PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-database-only
          POSTGRES_DB: role_guard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d role_guard_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run actual role-guard migrations and negative tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-local-database-only
          PGDATABASE: role_guard_ci
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/role_authority_ci_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021210023_guard_role_authority_emergency_20261021.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021210159_revoke_guard_trigger_rpc_grants_20261021.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/role_authority_guard_smoke.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid=p.pronamespace
              WHERE n.nspname='public'
                AND p.proname IN ('guard_profile_role_authority','guard_signup_privileged_metadata')
                AND (
                  has_function_privilege('anon',p.oid,'EXECUTE')
                  OR has_function_privilege('authenticated',p.oid,'EXECUTE')
                )
            ) THEN
              RAISE EXCEPTION 'Untrusted role can execute guard trigger function';
            END IF;
          END;
          $check$;
          SQL

  role-boundary-regressions:
    name: Role authority (isolated staging)
    if: ${{ !inputs.isolated_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Require staging database credentials
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          if [[ -z "$STAGING_DB_URL" ]]; then
            echo "::error::Missing SUPABASE_STAGING_DB_URL. Configure a staging database; do not use a production connection."
            exit 1
          fi
      - name: Validate privileged functions and guards
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/role_authority_guard_smoke.sql
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          DECLARE
            v_count integer;
          BEGIN
            SELECT count(*) INTO v_count
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='public'
              AND p.proname IN (
                'execute_sql_temp',
                'grant_patient_wallet_credit',
                'grant_medical_record_authorization',
                'set_user_role',
                'set_portal_and_role',
                'guard_profile_role_authority',
                'guard_signup_privileged_metadata'
              )
              AND (
                has_function_privilege('anon',p.oid,'EXECUTE')
                OR has_function_privilege('authenticated',p.oid,'EXECUTE')
              );
            IF v_count > 0 THEN
              RAISE EXCEPTION '% restricted functions remain executable by a public API role',v_count;
            END IF;
            IF NOT EXISTS(
              SELECT 1 FROM pg_trigger
              WHERE tgrelid='public.profiles'::regclass AND tgname='guard_profile_role_authority' AND tgenabled='O'
            ) OR NOT EXISTS(
              SELECT 1 FROM pg_trigger
              WHERE tgrelid='auth.users'::regclass AND tgname='guard_signup_privileged_metadata' AND tgenabled='O'
            ) THEN
              RAISE EXCEPTION 'Required role guard trigger missing';
            END IF;
          END;
          $check$;
          SQL
