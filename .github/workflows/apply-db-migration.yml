name: Apply DB Migration

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  apply-migration:
    name: 🚀 Apply Supabase Migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        run: |
          curl -sSL https://cli.supabase.com/install.sh | sh

      - name: Link Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref knywotiidsydsaveqkjs -p "$SUPABASE_DB_PASSWORD"

      - name: Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Update Types (Post-Migration)
        run: |
          # This triggers the type generation check or updates
          # In a real environment, we would trigger db-type-drift-check or just run the gen here
          echo "🚀 Database migrated. Type drift check will run next."
