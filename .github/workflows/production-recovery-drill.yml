name: Production database recovery drill

on:
  pull_request:
    paths:
      - scripts/db/**
      - .github/workflows/production-recovery-drill.yml
  workflow_dispatch:
    inputs:
      retain_bundle:
        description: Capture Storage and retain a public-key encrypted bundle for 30 days
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-database-recovery-drill-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  guards:
    name: Test recovery isolation safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: python3 scripts/db/test_recovery_source.py
      - run: python3 scripts/db/test_production_recovery_drill.py
      - run: python3 scripts/db/test_retained_recovery_bundle.py
      - run: python3 scripts/db/test_restore_retained_bundle.py
  retained-fixture:
    name: Restore synthetic retained copy after destroying its source
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: 2.122.0
      - name: Authenticate for pinned fixture database image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify required CLI commands
        run: |
          supabase init --help > /dev/null
          supabase start --help > /dev/null
          supabase stop --help > /dev/null
      - name: Retain synthetic copy, destroy source, restore offline and verify cleanup
        run: python3 scripts/db/test_retained_restore_database.py
  restore:
    name: Restore production export into offline disposable database
    needs: [guards, retained-fixture]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: 2.122.0
      - name: Authenticate for pinned Supabase database image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Check CLI command support
        run: |
          supabase --help > /dev/null
          supabase init --help > /dev/null
          supabase start --help > /dev/null
          supabase db dump --help > /dev/null
          supabase stop --help > /dev/null
      - name: Export source, verify offline restore and remove private working copy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RECOVERY_DRILL_CONFIRMATION: RESTORE-qxjjrpksmwwrmubhvjew
          PYTHONUNBUFFERED: '1'
          RECOVERY_RETAIN_BUNDLE: ${{ inputs.retain_bundle && 'true' || 'false' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.retain_bundle && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          SUPABASE_ACCESS_TOKEN: ${{ inputs.retain_bundle && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          RECOVERY_BACKUP_PUBLIC_KEY: ${{ vars.RECOVERY_BACKUP_PUBLIC_KEY }}
          RECOVERY_BACKUP_FINGERPRINT: ${{ vars.RECOVERY_BACKUP_FINGERPRINT }}
        run: python3 scripts/db/production_recovery_drill.py
      - name: Retain encrypted bundle only after successful restore and cleanup
        if: inputs.retain_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-output/recovery.tar.gz.gpg
            recovery-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

