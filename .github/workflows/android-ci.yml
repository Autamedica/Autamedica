name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties with placeholder credentials
        run: |
          cd apps/android
          echo "SUPABASE_URL=https://placeholder.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=placeholder-key" >> local.properties
          echo "SIGNALING_URL=wss://placeholder.autamedica.com/signaling" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=placeholder-client-id" >> local.properties

      - name: Compile and Run JVM Unit Tests
        run: |
          cd apps/android
          ./gradlew testDebugUnitTest

      - name: Compile Instrumented Tests
        run: |
          cd apps/android
          ./gradlew compileDebugAndroidTestSources
