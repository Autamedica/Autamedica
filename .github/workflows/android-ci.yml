name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.actor == 'coderabbitai[bot]' || github.actor == 'circleci-app[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && 'ignored' || 'active' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Build & Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties with placeholder credentials
        run: |
          cd apps/android
          echo "SUPABASE_URL=https://placeholder.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=placeholder-key" >> local.properties
          echo "SIGNALING_URL=wss://placeholder.autamedica.com/signaling" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=placeholder-client-id" >> local.properties

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 -c "
          import os, json
          val = os.environ.get('GOOGLE_SERVICES_JSON', '')
          path = 'apps/android/app/google-services.json'
          if val.strip():
              with open(path, 'w') as f:
                  f.write(val)
              print('✅ google-services.json created from secret')
          elif not os.path.exists(path):
              dummy = {
                  'project_info': {'project_number': '653971537811', 'project_id': 'autamedica-e54fa', 'storage_bucket': 'autamedica-e54fa.firebasestorage.app'},
                  'client': [{'client_info': {'mobilesdk_app_id': '1:653971537811:android:dummy', 'android_client_info': {'package_name': 'com.autamedica.android'}}, 'oauth_client': [], 'api_key': [{'current_key': 'dummy'}], 'services': {}}],
                  'configuration_version': '1'
              }
              with open(path, 'w') as f:
                  json.dump(dummy, f, indent=2)
              print('⚠️ Created fallback dummy google-services.json for CI')
          "

      - name: Compile and Run JVM Unit Tests
        run: |
          cd apps/android
          ./gradlew testDebugUnitTest -PfirebasePerformanceInstrumentationEnabled=false --console=plain

      - name: Compile Instrumented Tests
        run: |
          cd apps/android
          ./gradlew compileDebugAndroidTestSources -PfirebasePerformanceInstrumentationEnabled=false

      - name: Build unsigned release AAB (no Crashlytics mapping upload)
        run: |
          cd apps/android
          ./gradlew bundleRelease -x :app:uploadCrashlyticsMappingFileRelease -PfirebasePerformanceInstrumentationEnabled=false
          test -s app/build/outputs/bundle/release/app-release.aab
          echo 'UNSIGNED AAB BUILT — not uploaded to Google Play'
