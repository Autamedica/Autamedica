name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'supabase/functions/_shared/memed-mobile-policy.ts'
      - 'supabase/functions/memed-mobile-preflight/**'
      - 'apps/web/src/pages/api/doctors/prescriptions/memed-mobile-context.ts'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'supabase/functions/_shared/memed-mobile-policy.ts'
      - 'supabase/functions/memed-mobile-preflight/**'
      - 'apps/web/src/pages/api/doctors/prescriptions/memed-mobile-context.ts'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.actor == 'coderabbitai[bot]' || github.actor == 'circleci-app[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && 'ignored' || 'active' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Build & Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties with placeholder credentials
        run: |
          cd apps/android
          echo "SUPABASE_URL=https://placeholder.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=placeholder-key" >> local.properties
          echo "SIGNALING_URL=wss://placeholder.autamedica.com/signaling" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=placeholder-client-id" >> local.properties

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 -c "
          import os, json
          val = os.environ.get('GOOGLE_SERVICES_JSON', '')
          path = 'apps/android/app/google-services.json'
          if val.strip():
              with open(path, 'w') as f:
                  f.write(val)
              print('✅ google-services.json created from secret')
          elif not os.path.exists(path):
              dummy = {
                  'project_info': {'project_number': '653971537811', 'project_id': 'autamedica-e54fa', 'storage_bucket': 'autamedica-e54fa.firebasestorage.app'},
                  'client': [{'client_info': {'mobilesdk_app_id': '1:653971537811:android:dummy', 'android_client_info': {'package_name': 'com.autamedica.android'}}, 'oauth_client': [], 'api_key': [{'current_key': 'dummy'}], 'services': {}}],
                  'configuration_version': '1'
              }
              with open(path, 'w') as f:
                  json.dump(dummy, f, indent=2)
              print('⚠️ Created fallback dummy google-services.json for CI')
          "

      - name: Compile and Run JVM Unit Tests
        run: |
          cd apps/android
          ./gradlew testDebugUnitTest -PfirebasePerformanceInstrumentationEnabled=false --console=plain

      - name: Generate Android lint baseline from target branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          BASE_SHA="${BASE_SHA:-${GITHUB_SHA}^}"
          git fetch --no-tags origin "$BASE_SHA"
          BASELINE_WORKTREE="$RUNNER_TEMP/android-lint-baseline"
          git worktree add --detach "$BASELINE_WORKTREE" "$BASE_SHA"
          cp apps/android/local.properties "$BASELINE_WORKTREE/apps/android/local.properties"
          cp apps/android/app/google-services.json "$BASELINE_WORKTREE/apps/android/app/google-services.json"

          python3 - "$BASELINE_WORKTREE/apps/android/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          baseline_config = """    lint {
                  baseline = file("lint-baseline.xml")
              }"""
          if baseline_config not in content:
              anchor = """    buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          kotlin {"""
              replacement = """    buildFeatures {
                  compose = true
                  buildConfig = true
              }

              lint {
                  baseline = file("lint-baseline.xml")
              }
          }

          kotlin {"""
              if content.count(anchor) != 1:
                  raise SystemExit("Could not identify the Android buildFeatures anchor for the baseline")
              content = content.replace(anchor, replacement)
          path.write_text(content, encoding="utf-8")
          PY

          cd "$BASELINE_WORKTREE/apps/android"
          ./gradlew updateLintBaseline -PfirebasePerformanceInstrumentationEnabled=false --console=plain
          test -s app/lint-baseline.xml
          cp app/lint-baseline.xml "$GITHUB_WORKSPACE/apps/android/app/lint-baseline.xml"
          cd "$GITHUB_WORKSPACE"
          git worktree remove "$BASELINE_WORKTREE" --force
          echo "Generated lint baseline from target commit $BASE_SHA"

      - name: Run Android lint (new findings only)
        run: |
          cd apps/android
          ./gradlew lint -PfirebasePerformanceInstrumentationEnabled=false --console=plain

      - name: Run requested Debug lint task
        run: |
          cd apps/android
          ./gradlew lintDebug -PfirebasePerformanceInstrumentationEnabled=false --console=plain

      - name: Compile Instrumented Tests
        run: |
          cd apps/android
          ./gradlew compileDebugAndroidTestSources -PfirebasePerformanceInstrumentationEnabled=false

      - name: Build unsigned release AAB (no Crashlytics mapping upload)
        run: |
          cd apps/android
          ./gradlew bundleRelease -x :app:uploadCrashlyticsMappingFileRelease -PfirebasePerformanceInstrumentationEnabled=false
          test -s app/build/outputs/bundle/release/app-release.aab
          echo 'UNSIGNED AAB BUILT — not uploaded to Google Play'
