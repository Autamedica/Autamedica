name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties with placeholder credentials
        run: |
          cd apps/android
          echo "SUPABASE_URL=https://placeholder.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=placeholder-key" >> local.properties
          echo "SIGNALING_URL=wss://placeholder.autamedica.com/signaling" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=placeholder-client-id" >> local.properties

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
            echo "✅ google-services.json created from secret"
          elif [ ! -f apps/android/app/google-services.json ]; then
            cat << 'EOF' > apps/android/app/google-services.json
            {
              "project_info": {
                "project_number": "653971537811",
                "project_id": "autamedica-e54fa",
                "storage_bucket": "autamedica-e54fa.firebasestorage.app"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:653971537811:android:dummy",
                    "android_client_info": {
                      "package_name": "com.autamedica.android"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [{"current_key": "dummy"}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}}
                }
              ],
              "configuration_version": "1"
            }
            EOF
            echo "⚠️ Created fallback dummy google-services.json for CI"
          fi

      - name: Compile and Run JVM Unit Tests
        run: |
          cd apps/android
          ./gradlew testDebugUnitTest

      - name: Compile Instrumented Tests
        run: |
          cd apps/android
          ./gradlew compileDebugAndroidTestSources
