name: 'Secrets Scan'

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging, develop ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: secrets-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: 'GitLeaks - Detección de secretos'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: 'TruffleHog - Verificación adicional'
    runs-on: ubuntu-latest
    # Solo ejecutar en PRs (TruffleHog requiere base != head)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@7c0734f987ad0bb30ee8da210773b800ee2016d3 # v3.93.4
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  custom-patterns:
    name: 'Patrones personalizados médicos'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for medical data patterns
        run: |
          echo "🔍 Buscando patrones de datos médicos sensibles..."

          # Patrones de datos médicos que NO deberían estar en código
          MEDICAL_PATTERNS=(
            "patient_id.*[0-9]{6,}"
            "medical_record.*[0-9]{6,}"
            "ssn.*[0-9]{3}-[0-9]{2}-[0-9]{4}"
            "npi.*[0-9]{10}"
            "hipaa.*key"
            "phi_[a-z0-9_]{12,}"
            "medical_key.*"
          )

          FOUND_ISSUES=false

          for pattern in "${MEDICAL_PATTERNS[@]}"; do
            echo "Checking pattern: $pattern"
            if grep -r -n -i "$pattern" \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=.next \
              --exclude-dir=.open-next \
              --exclude-dir=dist \
              --exclude-dir=.github \
              --exclude-dir=scripts \
              --exclude-dir=packages \
              --exclude-dir=test-database-glossary \
              --exclude="*.lock" \
              --exclude="*.md" \
              --exclude=".env*" \
              --exclude="*.example" \
              --exclude="*.sample" \
              . ; then
              echo "❌ FOUND POTENTIAL MEDICAL DATA LEAK: $pattern"
              FOUND_ISSUES=true
            fi
          done

          if [ "$FOUND_ISSUES" = true ]; then
            echo "🚨 CRITICAL: Potential medical data found in code"
            echo "This could violate HIPAA compliance"
            exit 1
          else
            echo "✅ No medical data patterns detected"
          fi
