name: WAHA Oracle to Cloudflare Secret Sync

on:
  push:
    branches:
      - ops/waha-oracle-setup-20261031
    paths:
      - .github/workflows/waha-cloudflare-secrets.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Store WAHA backend secrets only
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    env:
      OCI_HOST: ${{ secrets.OCI_OPENCLAW_HOST }}
      OCI_USER: ${{ secrets.OCI_OPENCLAW_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_OPENCLAW_SSH_KEY }}
      OCI_HOST_KEY: ${{ secrets.OCI_OPENCLAW_HOST_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Securely synchronize existing WAHA key
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          for v in OCI_HOST OCI_USER OCI_SSH_KEY OCI_HOST_KEY CF_TOKEN; do
            [[ -n "${!v:-}" ]] || { echo "missing_required_secret=$v"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/key
          printf '%s\n' "$OCI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/key ~/.ssh/known_hosts
          key="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=10 -o ConnectTimeout=15 -i ~/.ssh/key "$OCI_USER@$OCI_HOST" "sudo -n sed -n 's/^WAHA_API_KEY=//p' /etc/autamedica/waha.env" | head -n1)"
          [[ "$key" =~ ^[0-9a-f]{64}$ ]] || { echo "waha_key_missing_or_invalid"; exit 1; }
          base="https://api.cloudflare.com/client/v4/accounts/5b448192fe4b369642b68ad8f53a7603/workers/scripts/autamedica-whatsapp-mcp/secrets"
          for name in WAHA_URL WAHA_API_KEY; do
            if [[ "$name" == WAHA_URL ]]; then
              value="https://waha.autamedica.com"
            else
              value="$key"
            fi
            json="$(jq -cn --arg n "$name" --arg v "$value" '{type:"secret_text",name:$n,text:$v}')"
            reply="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 25 -X PUT "$base" -H "Authorization: Bearer $CF_TOKEN" -H "content-type: application/json" --data "$json")"
            [[ "$(jq -r '.success' <<< "$reply")" == true ]] || { echo "worker_secret_sync_failed=$name"; exit 1; }
          done
          unset key value json reply
          echo "worker_backend_secrets_synced=yes" | tee sync-status.txt
          echo "mcp_token_configured=not_by_this_workflow" | tee -a sync-status.txt
      - name: Report status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "WAHA Cloudflare secret sync outcome: ${{ steps.sync.outcome }}"
            cat sync-status.txt 2>/dev/null || true
            echo "No secret values are published."
          } > summary.txt
          gh api "repos/$GITHUB_REPOSITORY/issues/618/comments" -f body="$(cat summary.txt)"
