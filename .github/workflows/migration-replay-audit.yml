name: Migration Replay - Disposable Database Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migration-replay-audit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.actor == 'coderabbitai[bot]' || github.actor == 'circleci-app[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && 'ignored' || 'active' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  fresh-schema-replay:
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Replay migrations in disposable local Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.122.0
      - name: Verify no remote credentials are in use
        run: |
          set -euo pipefail
          # Never link or reset a hosted database in this workflow.
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          supabase --version
      - name: Authenticate GHCR for Supabase Docker images
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Replay all versioned SQL against a throwaway local database
        run: |
          set -euo pipefail
          # CLI starts a local Docker-backed Postgres and applies repo migrations.
          # The runner is destroyed at the end; do not connect to remote staging.
          env -u SUPABASE_INTERNAL_IMAGE_REGISTRY supabase db start
          supabase migration list --local
      - name: Verify security contracts on reconstructed clinical schema
        env:
          PGCONNECT_TIMEOUT: '5'
        run: |
          set -euo pipefail
          # Ephemeral local database only; no Supabase remote project credentials.
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=postgres
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/role_authority_guard_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/secure_dispatch_push_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/clinical_view_acl_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/kiosk_dispatch_acl_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/untrusted_table_privileges_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/public_table_default_privileges_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/production_sql_ledger_replay_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/health_reserve_and_care_team_removal_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/create_call_acl_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appointments_atomic_no_overlap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appointments_atomic_no_overlap_behavior.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appointment_actor_guard_behavior.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/appointment_actor_guard_contract.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/audit_log_immutable_provenance.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/memed_provider_integrity_smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/persistent_pharmacy_queue_behavior.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/clinical_admin_approval_authority.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/clinical_approval_rls_contract.sql

