name: E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'tests/e2e/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Test target'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - production

env:
  HUSKY: '0'

jobs:
  e2e-critical:
    name: Critical Paths
    runs-on: self-hosted
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'local')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages:core
      - run: pnpm --filter @autamedica/web build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SIGNALING_URL: ${{ secrets.PUBLIC_SIGNALING_URL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}

      - name: Serve and test
        run: |
          npx serve apps/web/dist -l 4321 &
          SERVER_PID=$!
          sleep 3

          npx playwright test tests/e2e/role-routing.spec.ts tests/e2e/astro-bridge-routing.spec.ts \
            --config=tests/e2e/playwright.simple.config.ts \
            --reporter=github 2>&1 || TEST_EXIT=$?

          kill $SERVER_PID 2>/dev/null || true
          exit ${TEST_EXIT:-0}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 7

  e2e-production:
    name: Production
    runs-on: self-hosted
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile

      - name: Production tests
        run: |
          BASE_URL=https://www.autamedica.com npx playwright test tests/e2e/role-routing.spec.ts \
            --config=tests/e2e/playwright.simple.config.ts \
            --reporter=github
        env:
          BASE_URL: https://www.autamedica.com
