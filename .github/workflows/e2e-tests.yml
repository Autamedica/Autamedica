name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'tests/e2e/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Test target'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.actor == 'coderabbitai[bot]' || github.actor == 'circleci-app[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && 'ignored' || 'active' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.2'

jobs:
  e2e-critical:
    name: Critical Paths
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'local'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: npx playwright install --with-deps chromium
      - name: Build workspace packages
        run: pnpm build:packages:core
      - run: pnpm --filter @autamedica/web build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SIGNALING_URL: ${{ secrets.PUBLIC_SIGNALING_URL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          RENAPDIS_RL_NUMBER: ${{ secrets.RENAPDIS_RL_NUMBER || 'RL-2026-47574120-APN-SSVEIYES#MS' }}

      - name: Run critical routing test
        run: |
          npx playwright test tests/e2e/astro-bridge-routing.spec.ts tests/e2e/clinical-pharmacy-intake.spec.ts \
            --config=tests/e2e/playwright.astro-bridge.config.ts \
            --reporter=github
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SIGNALING_URL: ${{ secrets.PUBLIC_SIGNALING_URL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          PUBLIC_PATIENTS_URL: https://paciente.autamedica.com
          PUBLIC_DOCTORS_URL: https://doctor.autamedica.com
          PUBLIC_COMPANIES_URL: https://empresa.autamedica.com
          PUBLIC_ADMIN_URL: https://autamedica-admin.pages.dev
          RENAPDIS_RL_NUMBER: ${{ secrets.RENAPDIS_RL_NUMBER || 'RL-2026-47574120-APN-SSVEIYES#MS' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 7

  e2e-production:
    name: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-core: 'false'
      - run: npx playwright install --with-deps chromium

      - name: Production tests
        run: |
          npx playwright test tests/e2e/role-routing.spec.ts \
            --config=tests/e2e/playwright.simple.config.ts \
            --reporter=github
        env:
          BASE_URL: https://www.autamedica.com
