name: Authorized production recovery password rotation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter RESET-qxjjrpksmwwrmubhvjew after staging matching DB password and URL secrets'
        required: true
        type: string
  pull_request:
    paths:
      - 'scripts/db/*recovery*'
      - '.github/workflows/recovery-password-rotation.yml'

permissions:
  contents: read

concurrency:
  group: production-recovery-password-rotation
  cancel-in-progress: false

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: python3 scripts/db/test_recovery_source.py
      - run: python3 scripts/db/test_recovery_rotation.py

  rotate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Rotate through Management API and verify read-only connectivity
        env:
          ROTATION_CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/db/rotate_recovery_password.py
