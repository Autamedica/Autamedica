name: 'Desplegar Producción (Pages)'

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # ============================================
  # Job 1: Web Landing (Astro) — autamedica.com
  # ============================================
  deploy-web:
    name: 'Deploy Web (Astro)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages core
        run: pnpm run build:packages

      - name: Build Astro app
        working-directory: apps/web
        run: pnpm build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        run: pnpm dlx wrangler pages deploy dist --project-name autamedica-web --branch main

      - name: Link custom domains (autamedica.com)
        run: |
          for domain in "autamedica.com" "www.autamedica.com"; do
            http_code=$(curl -s -o /tmp/cf_domain_response.json -w "%{http_code}" \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/autamedica-web/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"$domain\"}")
            if [ "$http_code" = "200" ]; then
              echo "✅ $domain: vinculado exitosamente"
            elif [ "$http_code" = "409" ]; then
              echo "✅ $domain: ya estaba vinculado"
            else
              echo "⚠️  $domain: HTTP $http_code — revisa que el dominio esté en la zona de Cloudflare"
              cat /tmp/cf_domain_response.json
            fi
          done

  # ============================================
  # Job 2: Doctors Portal
  # ============================================
  deploy-doctors:
    name: 'Deploy Doctors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages core
        run: pnpm run build:packages

      - name: Build doctors for Cloudflare (OpenNext)
        run: pnpm --filter @autamedica/doctors build:cloudflare
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        working-directory: apps/doctors
        run: pnpm dlx wrangler pages deploy .open-next --project-name autamedica-doctors --branch production

  # ============================================
  # Job 3: Companies Portal
  # ============================================
  deploy-companies:
    name: 'Deploy Companies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages core
        run: pnpm run build:packages

      - name: Build companies for Cloudflare (OpenNext)
        run: pnpm --filter @autamedica/companies build:cloudflare
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        working-directory: apps/companies
        run: pnpm dlx wrangler pages deploy .open-next/dist --project-name autamedica-companies --branch production
