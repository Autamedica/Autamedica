name: Build and Deploy

on:
  push:
    branches: [main, staging, develop]
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.2'

jobs:
  validate:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages:core

      - name: Run linter
        run: pnpm lint

      - name: TypeScript check
        run: pnpm check:all

  deploy-db:
    name: Deploy DB Migrations
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy edge functions
        run: supabase functions deploy || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  build-pages:
    name: Build and Deploy Pages
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        app: [web, patients, doctors, companies, admin]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages:core

      - name: Build app
        run: |
          if [ "${{ matrix.app }}" = "web" ]; then
            pnpm --filter @autamedica/${{ matrix.app }} build
          else
            pnpm --filter @autamedica/${{ matrix.app }} run build:cloudflare
          fi
        env:
          NODE_ENV: production
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_DOCTORS_URL: https://autamedica-doctors.pages.dev
          PUBLIC_PATIENTS_URL: https://patients.autamedica.com
          PUBLIC_COMPANIES_URL: https://autamedica-companies.pages.dev
          PUBLIC_ADMIN_URL: https://autamedica-admin.pages.dev
          PUBLIC_WEB_URL: https://autamedica-web.pages.dev
          NEXT_PUBLIC_APP_URL: https://www.autamedica.com
          NEXT_PUBLIC_BASE_URL_AUTH: https://autamedica-web.pages.dev
          NEXT_PUBLIC_BASE_URL_WEB: https://autamedica-web.pages.dev
          NEXT_PUBLIC_BASE_URL_PATIENTS: https://patients.autamedica.com
          NEXT_PUBLIC_BASE_URL_DOCTORS: https://autamedica-doctors.pages.dev
          NEXT_PUBLIC_BASE_URL_COMPANIES: https://autamedica-companies.pages.dev
          NEXT_PUBLIC_BASE_URL_ADMIN: https://autamedica-admin.pages.dev
          NEXT_PUBLIC_SITE_URL: https://autamedica-web.pages.dev

      - name: Determine deploy directory
        id: deploy_dir
        run: |
          if [ "${{ matrix.app }}" = "web" ]; then
            echo "DIR=apps/${{ matrix.app }}/dist" >> "$GITHUB_OUTPUT"
          else
            echo "DIR=apps/${{ matrix.app }}/.open-next" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ steps.deploy_dir.outputs.DIR }} --project-name=autamedica-${{ matrix.app }} --branch=${{ github.ref_name }}

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [build-pages]
    steps:
      - name: Test homepage
        run: |
          domain="autamedica.com"
          if [ "${{ github.ref_name }}" = "staging" ]; then
            domain="staging.autamedica.com"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            domain="develop.autamedica.com"
          fi

          status="$(curl -o /dev/null -s -w "%{http_code}" -L "https://www.${domain}")"
          if [ "$status" != "200" ]; then
            echo "::error::Homepage returned $status"
          fi
          echo "Homepage OK ($status)"

  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-db, build-pages, smoke-tests]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database and edge functions: ${{ needs.deploy-db.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare Pages: ${{ needs.build-pages.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke tests: ${{ needs.smoke-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
