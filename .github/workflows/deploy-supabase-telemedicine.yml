name: Deploy Supabase Telemedicine

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref (optional, falls back to secrets)"
        required: false
        type: string
      apply_db_migrations:
        description: "Apply telemedicine migrations"
        required: true
        default: true
        type: boolean
      deploy_edge_functions:
        description: "Deploy create-call and update-call-status"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-supabase-telemedicine.yml"
      - "supabase/functions/create-call/**"
      - "supabase/functions/update-call-status/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SECRET_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SECRET_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SECRET_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SECRET_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SECRET_FALLBACK_TOKEN: ${{ secrets.SUPABASE_SECRET_KEY }}
      INPUT_PROJECT_REF: ${{ github.event.inputs.project_ref }}
      INPUT_APPLY_DB: ${{ github.event.inputs.apply_db_migrations }}
      INPUT_DEPLOY_FUNCTIONS: ${{ github.event.inputs.deploy_edge_functions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq
          npm i -g supabase@2
          supabase --version
          psql --version

      - name: Resolve project and token
        run: |
          set -euo pipefail

          PROJECT_REF="${INPUT_PROJECT_REF:-}"
          if [ -z "$PROJECT_REF" ]; then
            PROJECT_REF="${SECRET_PROJECT_REF:-}"
          fi
          if [ -z "$PROJECT_REF" ] && [ -n "${SECRET_SUPABASE_URL:-}" ]; then
            PROJECT_REF=$(echo "$SECRET_SUPABASE_URL" | sed -E 's#https?://([^.]+)\.supabase\.co#\1#')
          fi

          if [ -z "$PROJECT_REF" ]; then
            echo "❌ Could not resolve SUPABASE project ref"
            exit 1
          fi

          TOKEN="${SECRET_ACCESS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${SECRET_FALLBACK_TOKEN:-}"
          fi

          if [ -z "$TOKEN" ]; then
            echo "❌ Missing token secret. Expected SUPABASE_ACCESS_TOKEN or SUPABASE_SECRET_KEY"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "PROJECT_REF=$PROJECT_REF" >> "$GITHUB_ENV"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "✅ Project ref: $PROJECT_REF"

      - name: Validate Supabase API access
        run: |
          set -euo pipefail
          supabase projects list | head -n 20
          supabase functions list --project-ref "$PROJECT_REF" || true

      - name: Apply DB migrations
        if: env.INPUT_APPLY_DB == 'true'
        run: |
          set -euo pipefail

          DB_URL="${SECRET_DB_URL:-}"
          if [ -z "$DB_URL" ]; then
            if [ -z "${SECRET_DB_PASSWORD:-}" ]; then
              echo "❌ Missing SUPABASE_DB_URL and SUPABASE_DB_PASSWORD"
              exit 1
            fi
            ENC_PASS=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['SECRET_DB_PASSWORD'], safe=''))")
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PASS}@aws-1-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require"
          fi

          echo "Applying migrations against ${PROJECT_REF}..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260219103000_harden_calls_rpc_permissions.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260219114000_normalize_telemedicine_sessions_participants.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260219125000_secure_calls_rpc_authenticated_fallback.sql

      - name: Deploy Edge Functions
        if: env.INPUT_DEPLOY_FUNCTIONS == 'true'
        run: |
          set -euo pipefail
          supabase functions deploy create-call --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy update-call-status --project-ref "$PROJECT_REF" --use-api

      - name: Smoke check functions
        if: env.INPUT_DEPLOY_FUNCTIONS == 'true'
        run: |
          set -euo pipefail
          BASE_URL="${SECRET_SUPABASE_URL:-https://${PROJECT_REF}.supabase.co}"

          CREATE_CODE=$(curl -s -o /tmp/create_call_out.txt -w "%{http_code}" -X OPTIONS "${BASE_URL}/functions/v1/create-call")
          UPDATE_CODE=$(curl -s -o /tmp/update_call_out.txt -w "%{http_code}" -X OPTIONS "${BASE_URL}/functions/v1/update-call-status")

          echo "create-call OPTIONS status: ${CREATE_CODE}"
          echo "update-call-status OPTIONS status: ${UPDATE_CODE}"

          if [ "$CREATE_CODE" = "404" ] || [ "$UPDATE_CODE" = "404" ]; then
            echo "❌ Functions still return 404 after deploy"
            exit 1
          fi

          echo "✅ Functions reachable"
