name: Recovery memory configuration inspection
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/recovery-memory-inspection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/recovery-memory-inspection')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only fixed production Postgres configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import sys
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise RuntimeError("Redirect refused")

          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          if not token:
              sys.exit("Management credential unavailable")
          origin = "https://api.supabase.com"
          def read(path):
              request = Request(origin + path, headers={"Authorization": "Bearer " + token, "Accept": "application/json"})
              try:
                  with build_opener(NoRedirect()).open(request, timeout=30) as response:
                      if response.status != 200 or response.geturl() != origin + path:
                          raise RuntimeError()
                      raw = response.read(1048577)
                  if len(raw) > 1048576:
                      raise RuntimeError()
                  return json.loads(raw)
              except HTTPError as error:
                  code = error.code
                  error.close()
                  sys.exit("Read-only configuration inspection failed (HTTP " + str(code) + ")")
              except Exception:
                  sys.exit("Read-only configuration inspection failed; private diagnostics withheld")

          # Read active compute sizing from the official v1 billing addon endpoint.
          # No pricing or other account details are emitted.
          addons = read("/v1/projects/qxjjrpksmwwrmubhvjew/billing/addons")
          if not isinstance(addons, dict) or not isinstance(addons.get("selected_addons"), list):
              sys.exit("Unexpected compute addon response")
          compute = []
          for item in addons["selected_addons"]:
              if not isinstance(item, dict) or item.get("type") != "compute_instance":
                  continue
              variant = item.get("variant")
              variant_id = variant.get("id") if isinstance(variant, dict) else variant
              if not isinstance(variant_id, str) or len(variant_id) > 48 or not variant_id.startswith("ci_"):
                  sys.exit("Invalid compute variant")
              compute.append(variant_id)
          selected_types = [item["type"] for item in addons["selected_addons"]
                            if isinstance(item, dict) and isinstance(item.get("type"), str)
                            and len(item["type"]) <= 48]
          project = read("/v1/projects/qxjjrpksmwwrmubhvjew")
          if not isinstance(project, dict):
              sys.exit("Unexpected project details response")
          safe_compute_fields = ("compute_instance", "compute_size", "infra_compute_size",
                                 "compute_instance_size", "compute_addon")
          project_compute = {key: project[key] for key in safe_compute_fields
                             if isinstance(project.get(key), str) and len(project[key]) <= 48}
          print(json.dumps({"selected_addon_types": selected_types,
                            "compute_addon": compute,
                            "project_compute": project_compute}, sort_keys=True), flush=True)
          if len(compute) > 1:
              sys.exit("Ambiguous compute selection")
          if not compute and not project_compute:
              sys.exit("Active compute size not exposed by available read endpoints")

          # Optional v2 override inventory is not an authoritative PG runtime snapshot.
          response = read("/v2/projects/qxjjrpksmwwrmubhvjew/config")
          if not isinstance(response, dict) or not isinstance(response.get("data"), dict):
              sys.exit("Unexpected project config response")
          data = response["data"]
          if data.get("type") != "project_config":
              sys.exit("Unexpected project config envelope")
          attrs = data.get("attributes")
          database = attrs.get("database") if isinstance(attrs, dict) else None
          settings = database.get("postgres_settings") if isinstance(database, dict) else None
          if not isinstance(settings, dict):
              sys.exit("Unexpected postgres settings type")
          # Explicitly distinguish no recorded overrides from runtime settings.
          keys = ("shared_buffers", "effective_cache_size", "max_connections", "max_replication_slots", "work_mem", "maintenance_work_mem")
          selected = {}
          for key in keys:
              value = settings.get(key)
              if value is not None:
                  if isinstance(value, bool) or not isinstance(value, (str, int)) or not str(value).strip() or len(str(value)) > 64:
                      sys.exit("Invalid postgres override")
                  selected[key] = value
          print(json.dumps({"source": "Management API project overrides only", "overrides": selected, "overrides_present": bool(settings)}, sort_keys=True))
