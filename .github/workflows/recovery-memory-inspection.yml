name: Recovery memory configuration inspection
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/recovery-memory-inspection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/recovery-memory-inspection')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only fixed production Postgres configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import sys
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise RuntimeError("Redirect refused")

          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          if not token:
              sys.exit("Management credential unavailable")
          origin = "https://api.supabase.com/v1/projects/qxjjrpksmwwrmubhvjew"
          def read(path):
              request = Request(origin + path, headers={"Authorization": "Bearer " + token, "Accept": "application/json"})
              try:
                  with build_opener(NoRedirect()).open(request, timeout=30) as response:
                      if response.status != 200 or response.geturl() != origin + path:
                          raise RuntimeError()
                      raw = response.read(1048577)
                  if len(raw) > 1048576:
                      raise RuntimeError()
                  return json.loads(raw)
              except HTTPError as error:
                  code = error.code
                  error.close()
                  sys.exit("Read-only configuration inspection failed (HTTP " + str(code) + ")")
              except Exception:
                  sys.exit("Read-only configuration inspection failed; private diagnostics withheld")

          config = read("/config/database/postgres")
          if not isinstance(config, dict):
              sys.exit("Unexpected configuration response")
          keys = ("shared_buffers", "effective_cache_size", "max_connections", "work_mem", "maintenance_work_mem")
          selected = {}
          for key in keys:
              value = config.get(key)
              if value is not None and (not isinstance(value, (str, int)) or len(str(value)) > 64):
                  sys.exit("Unexpected configuration value")
              selected[key] = value
          print(json.dumps({"response_keys": sorted(config), "configuration": selected}, sort_keys=True))
