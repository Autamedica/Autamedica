name: Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'config/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'README.md'
      - 'GEMINI.md'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/ci/**'
      - 'scripts/lib/**'
      - 'scripts/check-policy.mjs'
      - 'scripts/validate-no-hardcode.mjs'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  HUSKY: '0'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.2'

jobs:
  changes:
    name: Detect
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      functions: ${{ steps.filter.outputs.functions }}
      types: ${{ steps.filter.outputs.types }}
      architecture: ${{ steps.filter.outputs.architecture }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'
            functions:
              - 'supabase/functions/**'
            types:
              - 'packages/types/**'
            architecture:
              - 'apps/**'
              - 'packages/**'
              - 'config/**'
              - 'supabase/**'
              - 'scripts/**'
              - 'docs/**'
              - 'README.md'
              - 'GEMINI.md'
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  db-type-drift:
    name: DB Type Drift
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      needs.changes.outputs.migrations == 'true' ||
      needs.changes.outputs.types == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages:core
      - run: pnpm check:db:type-drift

  architecture-v2:
    name: Architecture v2
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      needs.changes.outputs.architecture == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages:core
      - run: pnpm arch:v2:changed
      - run: pnpm arch:v2:imports:changed

  edge-function-lint:
    name: Edge Functions
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      needs.changes.outputs.functions == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Auth headers
        run: |
          for fn in supabase/functions/*/index.ts; do
            [[ ! -f "$fn" ]] && continue
            if ! grep -q 'authorization\|Authorization\|service_role\|anon' "$fn" 2>/dev/null; then
              echo "::warning::$fn — no auth check detected"
            fi
          done

      - name: Deno check
        run: |
          if ! command -v deno &>/dev/null; then
            echo "::warning::deno not installed — skipping edge function type check"
            exit 0
          fi
          for fn in supabase/functions/*/index.ts; do
            [[ ! -f "$fn" ]] && continue
            deno check --no-lock "$fn" 2>&1 || echo "::warning::$fn failed deno check"
          done

  clinical-coherence:
    name: Clinical
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages:core
      - name: Verify clinical observability (non-blocking)
        run: |
          if ! node scripts/ci/verify-clinical-observability.mjs; then
            echo "::warning::Clinical observability gaps detected; check is non-blocking until the missing schema lands."
          fi

  policy:
    name: Policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages:core
      - run: pnpm check:policy
      - run: pnpm hardcode:check
