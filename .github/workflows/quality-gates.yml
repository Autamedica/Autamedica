name: Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'config/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'README.md'
      - 'GEMINI.md'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/ci/**'
      - 'scripts/lib/**'
      - 'scripts/check-policy.mjs'
      - 'scripts/validate-no-hardcode.mjs'
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.actor == 'coderabbitai[bot]' || github.actor == 'circleci-app[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && 'ignored' || 'active' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  HUSKY: '0'
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.2'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_API: ${{ vars.TURBO_API }}

jobs:
  changes:
    name: Detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'pull_request')
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      functions: ${{ steps.filter.outputs.functions }}
      types: ${{ steps.filter.outputs.types }}
      architecture: ${{ steps.filter.outputs.architecture }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'
            functions:
              - 'supabase/functions/**'
            types:
              - 'packages/types/**'
            architecture:
              - 'apps/**'
              - 'packages/**'
              - 'config/**'
              - 'supabase/**'
              - 'scripts/**'
              - 'docs/**'
              - 'README.md'
              - 'GEMINI.md'
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  db-type-drift:
    name: DB Type Drift
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'schedule' || needs.changes.outputs.migrations == 'true' || needs.changes.outputs.types == 'true')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm check:db:type-drift

  architecture-v2:
    name: Architecture v2
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'schedule' || needs.changes.outputs.architecture == 'true')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm arch:v2:changed
      - run: pnpm arch:v2:imports:changed

  edge-function-lint:
    name: Edge Functions
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'schedule' || needs.changes.outputs.functions == 'true')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Auth headers
        run: |
          for fn in supabase/functions/*/index.ts; do
            [[ ! -f "$fn" ]] && continue
            if ! grep -q 'authorization\|Authorization\|service_role\|anon' "$fn" 2>/dev/null; then
              echo "::warning::$fn — no auth check detected"
            fi
          done

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check
        run: |
          status=0
          for fn in supabase/functions/*/index.ts; do
            [[ ! -f "$fn" ]] && continue
            deno check --config supabase/functions/deno.json --no-lock "$fn" || status=1
          done
          exit "$status"

  clinical-coherence:
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Clinical
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Verify clinical observability (non-blocking)
        run: |
          if ! node scripts/ci/verify-clinical-observability.mjs; then
            echo "::warning::Clinical observability gaps detected; check is non-blocking until the missing schema lands."
          fi

  policy:
    if: >-
      github.actor != 'coderabbitai[bot]' && github.actor != 'circleci-app[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm check:policy
      - run: pnpm hardcode:check
