name: Setup pnpm workspace
description: Install Node, pnpm, dependencies, and optionally build core packages.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '20'
  pnpm-version:
    description: pnpm version to install.
    required: false
    default: '9.15.2'
  build-core:
    description: Run pnpm build:packages:core after install.
    required: false
    default: 'true'
  cache-actions:
    description: Restore/save GitHub Actions caches; disable when cache egress is unavailable.
    required: false
    default: 'false'
  cache-turbo:
    description: Restore/save the local Turbo cache (requires cache-actions=true).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache-actions == 'true' && 'pnpm' || '' }}

    - run: pnpm install --frozen-lockfile
      shell: bash

    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      if: inputs.cache-actions == 'true' && inputs.cache-turbo == 'true'
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
          turbo-${{ runner.os }}-

    - run: pnpm build:packages:core
      if: inputs.build-core == 'true'
      shell: bash
