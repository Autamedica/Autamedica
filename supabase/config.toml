# Supabase Configuration for AutaMedica Platform

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "auth"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "https://www.autamedica.com"
additional_redirect_urls = [
  "https://www.autamedica.com/**",
  "https://autamedica-web.pages.dev/**",
  "http://localhost:3000/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_manual_linking = false
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_confirmations = true

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true

[realtime]
enabled = true
ip_version = "IPv4"

[functions]

# The handler verifies Supabase JWTs and a scoped HMAC guest token itself.
[functions.cloudflare-calls]
verify_jwt = false

[analytics]